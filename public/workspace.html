<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Team — SIH 2026</title>
<link rel="stylesheet" href="/app.css" />
<style>
  .chatbox{display:flex;flex-direction:column;height:340px}
  .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
  .msg{max-width:82%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.45}
  .msg .a{font-size:11px;font-weight:700;margin-bottom:2px;display:flex;gap:6px;align-items:center}
  .msg.mine{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.mine .a{color:#fff;opacity:.9}
  .msg.other{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.core{align-self:flex-start;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line))}
  .msg .t{font-size:10px;opacity:.6;margin-top:3px}
  .chatform{display:flex;gap:8px;margin-top:10px}
  .invite{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
  .avatars{display:flex;gap:6px;flex-wrap:wrap}
  .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--surface)}
  .av.empty{background:var(--surface-2);color:var(--faint);border:1px dashed var(--line-strong)}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <span class="brand"><span class="mk"></span> SIH 2026 <small id="roleTag">Team</small></span>
  <span class="spacer"></span><span class="who" id="who"></span>
  <a class="btn sm ghost" href="/connect.html">💬 SIH Connect</a>
  <button class="btn sm ghost" id="logout">Log out</button>
</div></div>

<div class="wrap grid" id="app" style="gap:18px"><div class="card pad">Loading…</div></div>
<div id="modalRoot"></div>

<script src="/route.js"></script>
<script>
async function api(u,o){const r=await fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},o));const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
function initials(n){return (n||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
let ME=null,TEAM=null,IDEAS=[],MILES=[],SUBS=[],chatTimer=null;

function agreementText(leader){
  if(leader) return '<h4>Participation Agreement (Idea Owner)</h4><ol><li>The idea I registered is my own original work and I <b>retain its ownership</b>.</li><li>I authorise the campaign to mentor and field this idea at SIH 2026.</li><li>My teammates contribute as members and make no ownership claim.</li><li>The core team may remove any participant for misconduct or inactivity.</li><li>I will represent the college professionally.</li></ol>';
  return '<h4>Idea &amp; Participation Agreement</h4><ol><li>The campaign problem ideas are the <b>intellectual property of the organiser</b>.</li><li>I join as a team member and claim <b>no ownership or commercial rights</b> over the idea.</li><li>I will not reuse or independently pursue this idea outside the campaign.</li><li>The core team may reassign or remove me for misconduct, inactivity or unwanted activity.</li><li>I will represent the college professionally.</li></ol>';
}
function showAgreement(){
  document.getElementById('modalRoot').innerHTML='<div class="overlay"><div class="card pad modal">'+
    '<div style="font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700">Team '+esc(TEAM?TEAM.teamCode:'')+' — before you enter</div>'+
    '<h2 style="font-size:22px;margin:8px 0 12px">Sign the agreement</h2><div class="agree">'+agreementText(TEAM&&TEAM.wantsLeader)+'</div>'+
    '<label class="checkline"><input type="checkbox" id="agChk" /> <span>I have read and accept the above terms.</span></label>'+
    '<div class="field"><label class="f" for="agName">Type your full name to sign</label><input id="agName" value="'+esc(ME.name)+'"/></div>'+
    '<button class="btn accent" id="agBtn" style="width:100%">Sign &amp; enter</button><div class="err" id="agErr"></div></div></div>';
  document.getElementById('agBtn').addEventListener('click',async()=>{
    const err=document.getElementById('agErr');err.textContent='';
    try{await api('/api/my/sign',{method:'POST',body:JSON.stringify({agree:document.getElementById('agChk').checked,signedName:document.getElementById('agName').value})});document.getElementById('modalRoot').innerHTML='';toast('Signed ✓ Welcome');boot();}
    catch(ex){err.textContent=ex.message;}
  });
}

function fillIdeas(sel,val){sel.innerHTML='<option value="">— select —</option>'+IDEAS.map(i=>'<option value="'+i.id+'"'+(val==i.id?' selected':'')+'>'+esc(i.name)+' · '+esc(i.theme)+(i.zone==='open'?' (attack)':i.zone==='proven'?' (proven)':'')+'</option>').join('');}
function odds(){const n=TEAM&&TEAM.psCount?Number(TEAM.psCount):null;if(!n)return{t:'Enter your PS submission count',c:'var(--muted)',big:'—',w:0};const o=Math.min(100,5/n*100);let t,c;if(n<=60){t='OPEN SEAT — great pick';c='var(--target)';}else if(n<=180){t='WORKABLE — build strong';c='var(--gold)';}else if(n<=350){t='CROWDED — only if elite';c='var(--accent)';}else{t='NEAR-LOCKED — switch';c='var(--crowd)';}return{t,c,big:o.toFixed(1)+'%',w:Math.max(4,Math.min(100,(1-(n-5)/495)*100))};}

async function loadChat(){
  try{const cs=await api('/api/my/comments');const box=document.getElementById('msgs');if(!box)return;
    const near=box.scrollHeight-box.scrollTop-box.clientHeight<60;
    box.innerHTML=cs.length?cs.map(c=>{
      const mine=c.authorId===ME.id;const cls=mine?'mine':(c.role==='core'?'core':'other');
      const roleb=c.role==='core'?' <span class="badge b-mid" style="font-size:9px;padding:1px 5px">core team</span>':c.role==='captain'?' <span class="badge b-proven" style="font-size:9px;padding:1px 5px">captain</span>':'';
      return '<div class="msg '+cls+'"><div class="a">'+esc(c.authorName)+(mine?'':roleb)+'</div><div>'+esc(c.text)+'</div><div class="t">'+new Date(c.at).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</div></div>';
    }).join(''):'<div class="faint" style="margin:auto;text-align:center;font-size:13px">No messages yet. Say hi to your team 👋</div>';
    if(near)box.scrollTop=box.scrollHeight;
  }catch(e){}
}

function render(){
  const app=document.getElementById('app');
  document.getElementById('roleTag').textContent=ME.isCaptain?'Captain':'Member';
  document.getElementById('who').innerHTML='<b>'+esc(ME.name)+'</b> · '+esc(TEAM.teamName)+' · '+esc(TEAM.teamCode);
  const o=odds();
  // avatars: captain + member accounts
  const memberNames=[TEAM.captainName].concat(TEAM.memberAccounts.filter(m=>m.name!==TEAM.captainName).map(m=>m.name));
  let avs='';for(let i=0;i<6;i++){avs+=memberNames[i]?'<span class="av" title="'+esc(memberNames[i])+'">'+initials(memberNames[i])+'</span>':'<span class="av empty">+</span>';}

  const invite = ME.isCaptain ? '<div class="card pad invite rise"><p class="sec-title">Invite your 5 team members</p>'+
      '<p class="muted" style="font-size:13px;margin:0 0 10px">Share these with your teammates. They open the site → <b>Join team</b> tab → enter these to join and chat.</p>'+
      '<div class="pillbtn" style="align-items:center;margin-bottom:8px"><span class="cred">Team ID: '+esc(TEAM.teamCode)+'</span><span class="cred">Password: '+esc(TEAM.teamPassword||'')+'</span><button class="btn sm ghost" id="copyInvite">Copy invite</button></div>'+
      '<div class="avatars">'+avs+'</div></div>' :
      '<div class="card pad rise"><p class="sec-title">Your team</p><div class="avatars">'+avs+'</div><p class="faint" style="font-size:12px;margin-top:8px">You joined as a member. Everyone shares the same workspace below.</p></div>';

  let approved=0;
  const timeline=MILES.map(m=>{
    const sub=SUBS.find(s=>s.milestoneId===m.id)||null;const st=sub?sub.status:'todo';if(st==='approved')approved++;
    const badge=st==='approved'?'<span class="badge b-approved">approved</span>':st==='submitted'?'<span class="badge b-submitted">under review</span>':st==='changes'?'<span class="badge b-changes">changes requested</span>':'<span class="badge b-todo">to do</span>';
    let links='';if(sub){const L=[['github','Repo'],['deck','Deck'],['demo','Demo'],['live','Live']].filter(x=>sub[x[0]]);if(L.length)links='<div class="links">'+L.map(x=>'<a href="'+esc(sub[x[0]])+'" target="_blank" rel="noopener">'+x[1]+' ↗</a>').join('')+'</div>';if(sub.notes)links+='<div class="muted" style="font-size:13px;margin-top:6px">'+esc(sub.notes)+(sub.by?' <span class="faint">— '+esc(sub.by)+'</span>':'')+'</div>';}
    const fb=sub&&sub.feedback?'<div class="fb"><b>Core team:</b> '+esc(sub.feedback)+'</div>':'';
    return '<div class="ms '+st+'"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="wk">Week '+m.week+'</span><h4 style="flex:1">'+esc(m.title)+'</h4>'+badge+'</div>'+
      '<div class="muted" style="font-size:13px">'+esc(m.detail)+'</div><div class="faint" style="font-size:12px;margin-top:4px">Expected: '+esc(m.asks)+'</div>'+links+fb+
      '<div style="margin-top:10px"><button class="btn sm" data-open="'+m.id+'">'+(sub?'Update':'Submit work')+'</button></div>'+
      '<form class="hidden" id="f-'+m.id+'" style="margin-top:12px">'+
        '<div class="row2"><div class="field"><label class="f">GitHub</label><input name="github" value="'+esc(sub?sub.github:'')+'" placeholder="repo link"/></div><div class="field"><label class="f">Deck</label><input name="deck" value="'+esc(sub?sub.deck:'')+'" placeholder="slides link"/></div></div>'+
        '<div class="row2"><div class="field"><label class="f">Demo video</label><input name="demo" value="'+esc(sub?sub.demo:'')+'" placeholder="YouTube/Loom"/></div><div class="field"><label class="f">Live URL</label><input name="live" value="'+esc(sub?sub.live:'')+'" placeholder="deployed"/></div></div>'+
        '<div class="field"><label class="f">Notes</label><textarea name="notes" placeholder="what you did / need help on">'+esc(sub?sub.notes:'')+'</textarea></div>'+
        '<button class="btn accent sm" type="submit">Submit for review</button> <span class="err" style="display:inline"></span></form></div>';
  }).join('');

  const dirs=(TEAM.directives||[]);
  const dirCard=dirs.length?'<div class="card pad rise"><p class="sec-title">Targets from the core team</p><div class="dirs">'+dirs.map(d=>'<div class="dir'+(d.done?' done':'')+'"><div><div>'+esc(d.text)+'</div><div class="faint mono" style="font-size:11px;margin-top:4px">— '+esc(d.by)+'</div></div>'+(d.done?'<span class="badge b-approved">done</span>':'<button class="btn sm" data-ack="'+d.id+'">Mark done</button>')+'</div>').join('')+'</div></div>':'';

  const ideaSetup = TEAM.wantsLeader
    ? '<div class="card pad" style="background:var(--surface-2)"><p class="sec-title">Your idea (owned by captain)</p><div style="font-weight:700">'+esc(TEAM.captainName)+'’s idea</div><div class="muted" style="font-size:13px;margin-top:4px">'+esc(TEAM.ownIdeaText||'')+'</div></div>'
    : '<div class="row2"><div class="field"><label class="f">Primary idea</label><select id="idea"></select></div><div class="field"><label class="f">Backup idea</label><select id="backup"></select></div></div>';

  app.innerHTML=
    invite+
    '<div class="grid rise" style="grid-template-columns:1.4fr .9fr;gap:16px">'+
      '<div class="card pad"><p class="sec-title">Mission setup <span class="faint" style="text-transform:none;letter-spacing:0">(anyone on the team can edit)</span></p>'+
        '<div class="field"><label class="f">Team name</label><input id="teamName" value="'+esc(TEAM.teamName||'')+'"/></div>'+ideaSetup+
        '<div class="row2"><div class="field"><label class="f">Problem Statement ID</label><input id="psId" value="'+esc(TEAM.psId||'')+'" placeholder="SIH26XXXX"/></div>'+
        '<div class="field"><label class="f">Live submissions on that PS</label><input id="psCount" type="number" min="0" value="'+(TEAM.psCount==null?'':TEAM.psCount)+'" placeholder="from portal"/></div></div>'+
        '<div class="row2"><div class="field"><label class="f">Members (up to 6)</label><input id="members" value="'+esc((TEAM.members||[]).join(', '))+'"/></div>'+
        '<div class="field" style="max-width:150px"><label class="f">Female (≥1)</label><input id="fcount" type="number" min="0" max="6" value="'+(TEAM.femaleCount||0)+'"/></div></div>'+
        '<button class="btn accent" id="saveTeam">Save setup</button><div class="err" id="tErr"></div></div>'+
      '<div class="card pad" style="display:flex;flex-direction:column"><p class="sec-title">Selection odds radar</p><p class="muted" style="font-size:13px;margin:0 0 8px">Only 4–5 teams per PS reach the finale. Fewer rivals = higher odds.</p>'+
        '<div style="text-align:center;margin:auto 0"><div class="mono" id="oBig" style="font-size:44px;font-weight:800;color:'+o.c+'">'+o.big+'</div>'+
        '<div class="faint mono" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase">chance to reach finale</div>'+
        '<div class="prog" style="margin-top:12px;height:10px"><i id="oBar" style="width:'+o.w+'%"></i></div><div id="oV" style="font-size:13px;font-weight:700;margin-top:10px;color:'+o.c+'">'+o.t+'</div></div></div>'+
    '</div>'+dirCard+
    '<div class="card pad rise"><p class="sec-title">Team chat</p><p class="muted" style="font-size:13px;margin:0 0 10px">Talk with your teammates and the core team here.</p>'+
      '<div class="chatbox"><div class="msgs" id="msgs"></div><form class="chatform" id="chatForm"><input id="chatInput" placeholder="Message your team…" autocomplete="off"/><button class="btn accent" type="submit">Send</button></form></div></div>'+
    '<div class="card pad rise"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="font-size:19px">The 8-Week Targets</h2><span class="spacer"></span><span class="faint mono" style="font-size:12px">'+approved+' / '+MILES.length+' approved</span><div class="prog" style="width:140px"><i style="width:'+(MILES.length?approved/MILES.length*100:0)+'%"></i></div></div>'+
      '<p class="muted" style="font-size:13px;margin:6px 0 4px">Submit work per target. Green = approved, red = fix &amp; resubmit.</p>'+timeline+'</div>';

  if(!TEAM.wantsLeader){fillIdeas(document.getElementById('idea'),TEAM.ideaId);fillIdeas(document.getElementById('backup'),TEAM.backupIdeaId);}
  const copyBtn=document.getElementById('copyInvite');if(copyBtn)copyBtn.addEventListener('click',()=>{const txt='Join our SIH team on '+location.origin+'/?join\nTeam ID: '+TEAM.teamCode+'\nPassword: '+(TEAM.teamPassword||'');navigator.clipboard&&navigator.clipboard.writeText(txt);toast('Invite copied');});
  document.getElementById('psCount').addEventListener('input',e=>{TEAM.psCount=e.target.value===''?null:Number(e.target.value);const o=odds();oBig.textContent=o.big;oBig.style.color=o.c;oBar.style.width=o.w+'%';oV.textContent=o.t;oV.style.color=o.c;});
  document.getElementById('saveTeam').addEventListener('click',async()=>{
    const err=document.getElementById('tErr');err.textContent='';
    const body={teamName:teamName.value,psId:psId.value,psCount:psCount.value,members:members.value.split(',').map(s=>s.trim()).filter(Boolean),femaleCount:fcount.value};
    if(!TEAM.wantsLeader){body.ideaId=document.getElementById('idea').value;body.backupIdeaId=document.getElementById('backup').value;}
    try{const d=await api('/api/my/team',{method:'PUT',body:JSON.stringify(body)});TEAM=d.team;toast('Saved ✓');}catch(ex){err.textContent=ex.message;}
  });
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>document.getElementById('f-'+b.dataset.open).classList.toggle('hidden')));
  MILES.forEach(m=>{const f=document.getElementById('f-'+m.id);if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();const er=f.querySelector('.err');er.textContent='';const fd=new FormData(f);try{const d=await api('/api/my/submission',{method:'POST',body:JSON.stringify({milestoneId:m.id,github:fd.get('github'),deck:fd.get('deck'),demo:fd.get('demo'),live:fd.get('live'),notes:fd.get('notes')})});SUBS=SUBS.filter(s=>s.milestoneId!==m.id);SUBS.push(d.submission);render();toast('Submitted ✓');}catch(ex){er.textContent=ex.message;}});});
  document.querySelectorAll('[data-ack]').forEach(b=>b.addEventListener('click',async()=>{await api('/api/my/directive/'+b.dataset.ack+'/ack',{method:'POST'});const dd=TEAM.directives.find(x=>x.id==b.dataset.ack);if(dd)dd.done=true;render();}));
  document.getElementById('chatForm').addEventListener('submit',async e=>{e.preventDefault();const inp=document.getElementById('chatInput');const t=inp.value.trim();if(!t)return;inp.value='';try{await api('/api/my/comment',{method:'POST',body:JSON.stringify({text:t})});await loadChat();}catch(ex){toast(ex.message);}});
  loadChat();
  if(chatTimer)clearInterval(chatTimer);chatTimer=setInterval(loadChat,8000);
}

async function boot(){
  const d=await api('/api/my').catch(()=>({user:null}));
  if(!d.user){location.href='/apply.html?login';return;}
  if(d.user.role==='admin'||d.user.role==='lead'){location.href='/admin.html';return;}
  ME=d.user;TEAM=d.team;
  if(ME.isCaptain && !ME.signedAgreement){IDEAS=await api('/api/ideas');MILES=await api('/api/milestones');showAgreement();return;}
  if(!TEAM){location.href='/status.html';return;}
  IDEAS=await api('/api/ideas');MILES=await api('/api/milestones');SUBS=await api('/api/my/submissions');
  render();
}
document.getElementById('logout').addEventListener('click',async()=>{await api('/api/logout',{method:'POST'});location.href='/';});
boot();
</script>
</body>
</html>
