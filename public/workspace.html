<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Command Center — SIH 2026</title>
<link rel="stylesheet" href="/app.css" />
<style>
  /* ============ SIH 2026 · Student Command Center ============
     Skin only — reuses app.css tokens. No logic/API/field changes. */
  :root{
    --navy:#0F172A; --blue:#2563EB; --blue-d:#1D4ED8; --blue-soft:#EAF1FF;
    --saffron:#EA580C; --saffron-soft:#FFF4E5; --ok:#16A34A; --ok-soft:#EAF8EF;
    --ink:#111827; --sub:#667085; --mut:#98A2B3; --bd:#E5E7EB; --bd2:#EEF0F3;
    --wbg:#F8F7F4; --bg-2:#F3F4F6; --card:#FFFFFF;
  }
  body{background:var(--wbg)}
  .cc-hidden{display:none!important}

  /* ---- header ---- */
  .cchead{position:sticky;top:0;z-index:40;background:rgba(247,247,245,.85);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
  .cchead .in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:64px;
    padding:10px 24px}
  @media(max-width:900px){.cchead .in{padding:10px 20px}}
  @media(max-width:560px){.cchead .in{padding:10px 16px}}
  .ccbrand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;color:var(--ink);font-size:16px}
  .ccbrand .mk{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--saffron));display:inline-block}
  .ccbrand small{font-weight:600;font-size:11px;color:var(--sub);letter-spacing:.02em}
  .ccnav{display:flex;gap:2px;margin-left:12px}
  .ccnav a{font-size:13.5px;font-weight:600;color:var(--sub);padding:7px 12px;border-radius:9px;text-decoration:none;transition:.15s}
  .ccnav a:hover{color:var(--ink);background:var(--blue-soft)}
  .ccsp{flex:1}
  .icobtn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--bd);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:.15s}
  .icobtn:hover{border-color:var(--blue);background:var(--blue-soft)}
  .badge-dot{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--blue);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--wbg)}
  .ccprof{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--bd);border-radius:999px;background:var(--card);cursor:pointer;transition:.15s}
  .ccprof:hover{border-color:var(--blue)}
  .ccav{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .ccprof .nm{font-size:13px;font-weight:700;color:var(--ink);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ccmenubtn{display:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--bd);background:var(--card);align-items:center;justify-content:center;font-size:18px;cursor:pointer}
  .ccdrop{position:absolute;top:60px;right:clamp(16px,4vw,28px);background:var(--card);border:1px solid var(--bd);
    border-radius:14px;box-shadow:0 16px 40px rgba(16,24,40,.14);padding:6px;min-width:190px;z-index:50}
  .ccdrop a,.ccdrop button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;
    font-size:13.5px;font-weight:600;color:var(--ink);padding:10px 12px;border-radius:9px;cursor:pointer;text-decoration:none}
  .ccdrop a:hover,.ccdrop button:hover{background:var(--blue-soft);color:var(--blue-d)}
  .ccdrop .sep{height:1px;background:var(--bd2);margin:4px 6px}

  /* ---- shell / grid (unified 1440 container, 65/35 main split) ---- */
  .ccwrap{max-width:1440px;margin:0 auto;padding:24px 24px 64px}
  #app{display:block}
  .ccstack{display:flex;flex-direction:column;gap:20px}
  .maincols{display:grid;grid-template-columns:1.86fr 1fr;gap:24px;align-items:start}
  .mcleft,.mcright{display:flex;flex-direction:column;gap:20px;min-width:0}
  .reshelp{display:grid;grid-template-columns:2fr 1fr;gap:20px}
  @media(max-width:1024px){.maincols{grid-template-columns:1fr}}
  @media(max-width:768px){.reshelp{grid-template-columns:1fr}}
  @media(max-width:900px){.ccwrap{padding:20px 20px 56px}.ccstack{gap:16px}.mcleft,.mcright{gap:16px}}
  @media(max-width:560px){.ccwrap{padding:16px 16px 48px}}
  /* legacy span classes kept inert (cards are 100% inside flex columns) */
  .col12,.col8,.col7,.col6,.col5,.col4{grid-column:auto}

  /* ---- cards ---- */
  .cc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(15,23,42,.05)}
  .cc.tight{padding:16px}
  .maincols .cc,.reshelp .cc{transition:box-shadow .2s ease,transform .2s ease}
  .maincols .cc:hover,.reshelp .cc:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(15,23,42,.08)}
  @media(max-width:1024px){.cc{padding:20px}}
  @media(max-width:560px){.cc{padding:16px}.cc.tight{padding:14px}}
  .cc h3.t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .cc h3.t .ico{font-size:14px}
  .cc .lnk{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;text-transform:none;letter-spacing:0}
  .cc .lnk:hover{color:var(--blue-d)}

  /* overview */
  .ov{display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    background:linear-gradient(120deg,var(--navy),#141d31);border:1px solid var(--navy);color:#fff}
  .ov h2{font-size:clamp(19px,2.4vw,25px);font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .ov .sub{color:#AEB7C6;font-size:13.5px}
  .ov .ovstats{display:flex;gap:26px;flex-wrap:wrap;margin-left:auto}
  .ovs .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A94A6}
  .ovs .v{font-size:16px;font-weight:800;margin-top:3px;color:#fff;font-variant-numeric:tabular-nums}
  .ovprog{min-width:150px}
  .ovbar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:7px}
  .ovbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#60A5FA);border-radius:99px;transition:width .5s ease}

  /* next move */
  .nm{border:1px solid var(--blue);background:linear-gradient(120deg,var(--blue-soft),var(--card) 70%);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .nm .ring{width:52px;height:52px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
  .nm .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-d)}
  .nm h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:3px 0 2px;color:var(--ink)}
  .nm p{font-size:13.5px;color:var(--sub);margin:0}
  .nm .go{margin-left:auto}

  /* buttons (local, match app.css btn) */
  .b{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13.5px;font-weight:700;
    padding:10px 16px;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;transition:.15s}
  .b:hover{border-color:var(--blue);color:var(--blue-d)}
  .b.pri{background:var(--blue);border-color:var(--blue);color:#fff}
  .b.pri:hover{background:var(--blue-d);color:#fff}
  .b.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}

  /* journey stepper */
  .jour{display:flex;flex-wrap:wrap;gap:6px;overflow:hidden}
  .step{flex:1;min-width:76px;text-align:center;position:relative}
  .step .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;background:var(--bd2);color:var(--mut);border:2px solid var(--bd);position:relative}
  .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue-soft)}
  .step .lb{font-size:10.5px;font-weight:700;color:var(--mut);line-height:1.2}
  .step.done .lb{color:var(--ink)}.step.cur .lb{color:var(--blue-d)}
  .step .bar{position:absolute;top:12px;left:50%;width:100%;height:2px;background:var(--bd);z-index:-1}
  .step.done .bar{background:var(--ok)}

  /* readiness / checklist */
  .chk{display:flex;flex-direction:column;gap:8px}
  .chk .it{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink)}
  .chk .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:transparent}
  .chk .it.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
  .chk .it.off{color:var(--sub)}
  .rd-top{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .rd-top .pct{font-size:30px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .rd-top .lb{font-size:12px;color:var(--sub)}
  .miniprog{height:8px;border-radius:99px;background:var(--bd2);overflow:hidden;margin:2px 0 14px}
  .miniprog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#4ADE80);border-radius:99px;transition:width .5s}

  /* fields */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.fgrid{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--mut)}
  .fld input,.fld select,.fld textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .fld textarea{min-height:70px;resize:vertical}
  .err{color:#DC2626;font-size:12.5px;margin-top:6px;min-height:1em}

  /* stat row */
  .statrow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  @media(max-width:760px){.statrow{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:420px){.statrow{grid-template-columns:repeat(2,1fr)}}
  .stat{border:1px solid var(--bd);border-radius:13px;padding:12px 14px;background:var(--card)}
  .stat .v{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .stat .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:5px}
  .stat.ov .v{color:#DC2626}.stat.up .v{color:var(--blue)}.stat.dn .v{color:var(--ok)}

  /* compact task list */
  .tfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tfilter button{font:inherit;font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--sub);cursor:pointer}
  .tfilter button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .tlist{display:flex;flex-direction:column;gap:8px}
  .trow{border:1px solid var(--bd);border-radius:12px;padding:11px 13px;background:var(--card);cursor:pointer;transition:.15s}
  .trow:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(16,24,40,.05)}
  .trow .top{display:flex;align-items:center;gap:10px}
  .trow .wk{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--blue-d);background:var(--blue-soft);border-radius:6px;padding:2px 7px;flex:none}
  .trow .ti{font-size:14px;font-weight:700;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .cw{font-size:16px;color:var(--mut);transition:.2s}
  .trow.open .cw{transform:rotate(90deg)}
  .trow .body{margin-top:10px}
  .trow .dt{font-size:12.5px;color:var(--sub);line-height:1.45}
  .trow .ask{font-size:11.5px;color:var(--mut);margin-top:5px}
  .trow .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .trow .links a{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none}
  .trow .fb{margin-top:8px;font-size:12.5px;background:var(--saffron-soft);border:1px solid #F3D9AE;color:#8A5A12;border-radius:9px;padding:8px 10px}

  /* assigned tasks */
  .taskrow .top{cursor:pointer}
  .prio{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;flex:none}
  .prio.p-high{background:#FEE2E2;color:#B91C1C}.prio.p-medium{background:var(--blue-soft);color:var(--blue-d)}.prio.p-low{background:var(--bd2);color:var(--sub)}
  .tstat{font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:6px;flex:none}
  .s-PENDING_ACCEPTANCE{background:var(--saffron-soft);color:var(--saffron)}
  .s-ACCEPTED,.s-IN_PROGRESS{background:var(--blue-soft);color:var(--blue-d)}
  .s-COMPLETED{background:#EDE9FE;color:#6D28D9}.s-VERIFIED{background:var(--ok-soft);color:var(--ok)}
  .s-REJECTED{background:#FEE2E2;color:#B91C1C}.s-CANCELLED{background:var(--bd2);color:var(--mut)}
  .dl{font-size:11.5px;font-weight:700;color:var(--sub);flex:none}
  .dl.over{color:#DC2626}.dl.soon{color:var(--blue)}
  .emptytask{font-size:13px;color:var(--mut);text-align:center;padding:16px 0}
  .assignform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  @media(max-width:520px){.assignform{grid-template-columns:1fr}}
  .assignform .full{grid-column:1/-1}
  .modact{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .mrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd2);font-size:13.5px}
  .mrow .k{color:var(--sub)}.mrow .v{color:var(--ink);font-weight:600;text-align:right}
  .b.danger{color:#B91C1C;border-color:#F3C0C0}.b.danger:hover{background:#FEF2F2;border-color:#DC2626}
  .b.ok{background:var(--ok);border-color:var(--ok);color:#fff}.b.ok:hover{background:#15803D}

  /* calendar */
  .calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .calhead .mo{font-weight:800;color:var(--ink);font-size:14px}
  .calnav{display:flex;gap:4px;margin-left:auto}
  .calnav button,.calview button{font:inherit;font-size:12px;font-weight:700;width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .calview{display:flex;gap:4px}
  .calview button{width:auto;padding:0 10px}
  .calview button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .callegend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 4px;font-size:11px;color:var(--sub)}
  .callegend span{display:flex;align-items:center;gap:5px}
  .lg{width:8px;height:8px;border-radius:50%;display:inline-block}
  .lg.meeting{background:var(--saffron)}.lg.task{background:var(--blue)}.lg.overdue{background:#DC2626}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .caldow{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--mut);text-align:center;padding:2px 0}
  .calcell{aspect-ratio:1;border-radius:8px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 0 0;font-size:11.5px;color:var(--ink);cursor:default;position:relative}
  .calcell.pad{color:var(--faint);opacity:.4}
  .calcell.today{background:var(--blue-soft);font-weight:800;color:var(--blue-d)}
  .calcell.has{cursor:pointer}
  .calcell.sel{border-color:var(--blue)}
  .caldots{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;justify-content:center}
  .caldot{width:5px;height:5px;border-radius:50%}
  .caldot.meeting{background:var(--saffron)}.caldot.task{background:var(--blue)}.caldot.overdue{background:#DC2626}
  .agenda{display:flex;flex-direction:column;gap:2px}
  .agday{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px}
  .agitem{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--bd2);cursor:pointer}
  .agitem:hover{background:var(--wbg)}
  .agitem .ad{width:8px;height:8px;border-radius:50%;flex:none}
  .agitem .ad.meeting{background:var(--saffron)}.agitem .ad.task{background:var(--blue)}.agitem .ad.overdue{background:#DC2626}
  .agitem .at{flex:1;font-size:13px;color:var(--ink);font-weight:600}
  .agitem .am{font-size:11.5px;color:var(--mut)}

  /* tasks (legacy board, kept for compatibility) */
  .tcols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:820px){.tcols{grid-template-columns:1fr}}
  .tcol .hd{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;display:flex;align-items:center;gap:7px}
  .tcol .hd .cnt{background:var(--bd2);color:var(--sub);border-radius:99px;padding:1px 8px;font-size:11px}
  .tcol.todo .hd .cnt{background:var(--saffron-soft);color:var(--saffron)}
  .tcol.prog .hd .cnt{background:var(--blue-soft);color:var(--blue-d)}
  .tcol.done .hd .cnt{background:var(--ok-soft);color:var(--ok)}
  .task{border:1px solid var(--bd);border-radius:13px;padding:12px 13px;margin-bottom:10px;background:var(--card);transition:.15s}
  .task:hover{border-color:var(--bd2);box-shadow:0 6px 18px rgba(16,24,40,.06);transform:translateY(-1px)}
  .task .wk{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-d);background:var(--blue-soft);border-radius:6px;padding:2px 7px}
  .task h4{font-size:14px;font-weight:700;color:var(--ink);margin:8px 0 4px}
  .task .dt{font-size:12.5px;color:var(--sub);line-height:1.45}
  .task .ask{font-size:11.5px;color:var(--mut);margin-top:6px}
  .task .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .task .links a{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none}
  .task .fb{margin-top:8px;font-size:12.5px;background:var(--saffron-soft);border:1px solid #F3D9AE;color:#8A5A12;border-radius:9px;padding:8px 10px}
  .pill{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
  .pill.p-todo{background:var(--bd2);color:var(--sub)}
  .pill.p-sub{background:var(--blue-soft);color:var(--blue-d)}
  .pill.p-appr{background:var(--ok-soft);color:var(--ok)}
  .pill.p-chg{background:var(--saffron-soft);color:var(--saffron)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.row2{grid-template-columns:1fr}}

  /* team hub / avatars */
  .avatars{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid var(--card)}
  .av.cap{background:var(--navy)}
  .av.empty{background:var(--bd2);color:var(--mut);border:1px dashed var(--bd)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd2);font-size:13.5px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--sub)}.kv .v{color:var(--ink);font-weight:700;text-align:right}
  .cred{font-family:var(--mono,monospace);font-size:12.5px;background:var(--wbg);border:1px solid var(--bd);border-radius:8px;padding:4px 9px;color:var(--ink)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{font-size:11.5px;font-weight:600;color:var(--sub);background:var(--wbg);border:1px solid var(--bd);border-radius:7px;padding:3px 9px}

  /* chat */
  .chatbox{display:flex;flex-direction:column;height:320px}
  .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
  .msg{max-width:82%;padding:8px 12px;border-radius:13px;font-size:13.5px;line-height:1.45}
  .msg .a{font-size:11px;font-weight:700;margin-bottom:2px;display:flex;gap:6px;align-items:center}
  .msg.mine{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  .msg.mine .a{color:#fff;opacity:.9}
  .msg.other{align-self:flex-start;background:var(--wbg);border:1px solid var(--bd);border-bottom-left-radius:4px;color:var(--ink)}
  .msg.core{align-self:flex-start;background:var(--saffron-soft);border:1px solid #F3D9AE;color:#7A4E10}
  .msg .t{font-size:10px;opacity:.6;margin-top:3px}
  .cmini{font-size:9px;padding:1px 5px;border-radius:5px;font-weight:800}
  .cmini.core{background:#F3D9AE;color:#7A4E10}.cmini.cap{background:var(--navy);color:#fff}
  .chatform{display:flex;gap:8px;margin-top:10px}
  .chatform input{flex:1;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
  .chatform input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}

  /* announcements / activity / upcoming lists */
  .feed{display:flex;flex-direction:column;gap:2px}
  .fi{display:flex;gap:11px;padding:10px 2px;border-bottom:1px solid var(--bd2)}
  .fi:last-child{border-bottom:0}
  .fi .fd{width:30px;height:30px;border-radius:9px;background:var(--wbg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
  .fi .ft{flex:1;font-size:13px;color:var(--ink);line-height:1.4}
  .fi .fm{font-size:11.5px;color:var(--mut);margin-top:2px}
  .fi.unread{position:relative}
  .fi.unread::before{content:"";position:absolute;left:-6px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
  .empty{font-size:13px;color:var(--mut);text-align:center;padding:18px 0}

  /* upcoming deadlines */
  .dlrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--bd2)}
  .dlrow:last-child{border-bottom:0}
  .dldot{width:9px;height:9px;border-radius:50%;flex:none}
  .dldot.norm{background:var(--blue)}.dldot.soon{background:var(--saffron)}.dldot.over{background:#DC2626}.dldot.meet{background:var(--saffron)}
  .dlbody{flex:1;min-width:0}
  .dltitle{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dlmeta{font-size:11.5px;color:var(--mut);margin-top:1px}
  .dlwhen{font-size:11.5px;font-weight:700;color:var(--sub);flex:none}
  .dlwhen.over{color:#DC2626}.dlwhen.soon{color:var(--saffron)}.dlwhen.norm{color:var(--blue-d)}

  /* quick actions */
  .qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:520px){.qa{grid-template-columns:repeat(2,1fr)}}
  .qa a{display:flex;flex-direction:column;gap:6px;padding:14px 12px;border:1px solid var(--bd);border-radius:13px;text-decoration:none;background:var(--card);transition:.15s}
  .qa a:hover{border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px)}
  .qa .qi{font-size:20px}
  .qa .ql{font-size:12.5px;font-weight:700;color:var(--ink)}

  /* odds mini */
  .odds{text-align:center}
  .odds .big{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .odds .lb{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:4px}
  .odds .pv{font-size:12.5px;font-weight:700;margin-top:8px}
  .prog{height:9px;border-radius:99px;background:var(--bd2);overflow:hidden;margin-top:8px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--saffron));border-radius:99px;transition:width .3s}

  @media(max-width:820px){
    .ccnav{display:none} .ccprof .nm{display:none} .ccmenubtn{display:flex}
    .ov .ovstats{margin-left:0;width:100%;justify-content:space-between;gap:14px}
  }
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 12px 30px rgba(16,24,40,.25);z-index:99}
  /* agreement modal reuse */
  .overlay{position:fixed;inset:0;background:rgba(11,18,32,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
  .modal{max-width:520px;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;max-height:90vh;overflow:auto}
  .agree{font-size:13.5px;color:var(--sub);line-height:1.6}.agree h4{color:var(--ink);margin:0 0 8px}.agree ol{margin:0;padding-left:18px}
  .checkline{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink);margin:14px 0}
</style>
</head>
<body>

<header class="cchead">
  <div class="in">
    <span class="ccbrand"><span class="mk"></span> SIH 2026 <small id="roleTag">Command Center</small></span>
    <nav class="ccnav">
      <a href="#top">Dashboard</a><a href="#team">Team</a><a href="#tasks">Tasks</a>
      <a href="#chat">Chat</a><a href="#resources">Resources</a>
    </nav>
    <span class="ccsp"></span>
    <button class="icobtn" id="bellBtn" title="Notifications">🔔<span class="badge-dot cc-hidden" id="bellCt">0</span></button>
    <div class="ccprof" id="profBtn"><span class="ccav" id="profAv">?</span><span class="nm" id="profNm">…</span></div>
    <button class="ccmenubtn" id="menuBtn">☰</button>
  </div>
</header>

<div class="ccwrap"><a id="top"></a>
  <div id="app"><div class="cc">Loading your command center…</div></div>
</div>
<div id="dropRoot"></div>
<div id="modalRoot"></div>

<script src="/route.js"></script>
<script>
async function api(u,o){const r=await fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},o));const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
function initials(n){return (n||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function timeAgo(ts){if(!ts)return'';const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
let ME=null,TEAM=null,IDEAS=[],MILES=[],SUBS=[],CONN=null,chatTimer=null;
let TASKS=[],TASKMETA={members:[],isLeader:false},taskSSE=null;
let MEETINGS=[],CAL=null;
async function loadTasks(){try{const d=await api('/api/my/tasks');TASKS=d.tasks||[];TASKMETA={members:d.members||[],isLeader:!!d.isLeader};}catch(e){TASKS=[];}}
async function loadMeetings(){try{const d=await api('/api/my/meetings');MEETINGS=d.meetings||[];}catch(e){MEETINGS=[];}}

/* ---------- agreement (unchanged flow) ---------- */
function agreementText(leader){
  if(leader) return '<h4>Participation Agreement (Idea Owner)</h4><ol><li>The idea I registered is my own original work and I <b>retain its ownership</b>.</li><li>I authorise the campaign to mentor and field this idea at SIH 2026.</li><li>My teammates contribute as members and make no ownership claim.</li><li>The core team may remove any participant for misconduct or inactivity.</li><li>I will represent the college professionally.</li></ol>';
  return '<h4>Idea &amp; Participation Agreement</h4><ol><li>The campaign problem ideas are the <b>intellectual property of the organiser</b>.</li><li>I join as a team member and claim <b>no ownership or commercial rights</b> over the idea.</li><li>I will not reuse or independently pursue this idea outside the campaign.</li><li>The core team may reassign or remove me for misconduct, inactivity or unwanted activity.</li><li>I will represent the college professionally.</li></ol>';
}
function showAgreement(){
  document.getElementById('modalRoot').innerHTML='<div class="overlay"><div class="modal">'+
    '<div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-d);font-weight:800">Team '+esc(TEAM?TEAM.teamCode:'')+' — before you enter</div>'+
    '<h2 style="font-size:22px;margin:8px 0 12px;color:var(--ink)">Sign the agreement</h2><div class="agree">'+agreementText(TEAM&&TEAM.wantsLeader)+'</div>'+
    '<label class="checkline"><input type="checkbox" id="agChk" /> <span>I have read and accept the above terms.</span></label>'+
    '<div class="fld"><label for="agName">Type your full name to sign</label><input id="agName" value="'+esc(ME.name)+'"/></div>'+
    '<button class="b pri" id="agBtn" style="width:100%;margin-top:14px;justify-content:center">Sign &amp; enter</button><div class="err" id="agErr"></div></div></div>';
  document.getElementById('agBtn').addEventListener('click',async()=>{
    const err=document.getElementById('agErr');err.textContent='';
    try{await api('/api/my/sign',{method:'POST',body:JSON.stringify({agree:document.getElementById('agChk').checked,signedName:document.getElementById('agName').value})});document.getElementById('modalRoot').innerHTML='';toast('Signed ✓ Welcome');boot();}
    catch(ex){err.textContent=ex.message;}
  });
}

function fillIdeas(sel,val){sel.innerHTML='<option value="">— select —</option>'+IDEAS.map(i=>'<option value="'+i.id+'"'+(val==i.id?' selected':'')+'>'+esc(i.name)+' · '+esc(i.theme)+(i.zone==='open'?' (attack)':i.zone==='proven'?' (proven)':'')+'</option>').join('');}
function odds(){const n=TEAM&&TEAM.psCount?Number(TEAM.psCount):null;if(!n)return{t:'Enter your PS submission count',c:'var(--mut)',big:'—',w:0};const o=Math.min(100,5/n*100);let t,c;if(n<=60){t='OPEN SEAT — great pick';c='var(--ok)';}else if(n<=180){t='WORKABLE — build strong';c='var(--saffron)';}else if(n<=350){t='CROWDED — only if elite';c='var(--blue)';}else{t='NEAR-LOCKED — switch';c='#DC2626';}return{t,c,big:o.toFixed(1)+'%',w:Math.max(4,Math.min(100,(1-(n-5)/495)*100))};}

/* ---------- derived state (only real data) ---------- */
function subFor(mid){return SUBS.find(s=>s.milestoneId===mid)||null;}
function counts(){let approved=0,submitted=0,changes=0;MILES.forEach(m=>{const s=subFor(m.id);if(!s)return;if(s.status==='approved')approved++;else if(s.status==='submitted')submitted++;else if(s.status==='changes')changes++;});return{approved,submitted,changes,total:MILES.length,pct:MILES.length?Math.round(approved/MILES.length*100):0};}
function teamSize(){return (TEAM.memberAccounts?TEAM.memberAccounts.length:0)+1;}
function problemChosen(){return !!(TEAM.psId||TEAM.ideaName||(TEAM.wantsLeader&&TEAM.ownIdeaText));}

function journey(){
  const c=counts();const built=SUBS.length>0;const anyChg=SUBS.some(s=>s.status==='changes'||s.status==='submitted');
  const steps=[
    {lb:'Applied',done:true},
    {lb:'Selected',done:true},
    {lb:'Team formed',done:teamSize()>=2},
    {lb:'Problem chosen',done:problemChosen()},
    {lb:'Build',done:built},
    {lb:'Review',done:SUBS.some(s=>s.status==='approved'||s.status==='submitted')},
    {lb:'Submission',done:c.approved>=6},
    {lb:'Finals',done:false}
  ];
  let curSet=false;
  for(const s of steps){if(!s.done&&!curSet){s.cur=true;curSet=true;}}
  return steps;
}
function currentStageName(){const j=journey();const cur=j.find(s=>s.cur);return cur?cur.lb:'Finals ready';}

function readiness(){
  const c=counts();
  const items=[
    {lb:'Team formed',on:teamSize()>=2},
    {lb:'Team profile complete',on:!!(TEAM.teamName&&(TEAM.ideaName||TEAM.wantsLeader))},
    {lb:'Problem selected',on:!!TEAM.psId},
    {lb:'Prototype shipped',on:SUBS.some(s=>s.github||s.live)},
    {lb:'Reviewed by core team',on:SUBS.some(s=>s.status==='approved'||s.feedback)},
    {lb:'Portal submission',on:c.approved>=6}
  ];
  const on=items.filter(i=>i.on).length;
  return{items,pct:Math.round(on/items.length*100)};
}

function nextMove(){
  const c=counts();
  const mt=myTasks();
  const od=mt.filter(isOverdue);if(od.length)return{eb:'Overdue',ico:'⏰',t:od[0].title,d:'This task is past its deadline — open it and update or complete it now.',target:'mytasks',label:'Open task'};
  const pa=mt.filter(t=>t.status==='PENDING_ACCEPTANCE');if(pa.length)return{eb:'Awaiting you',ico:'📥',t:'Respond to: '+pa[0].title,d:'A task is waiting for you to accept or reject.',target:'mytasks',label:'Review'};
  const ip=mt.filter(t=>t.status==='ACCEPTED'||t.status==='IN_PROGRESS');if(ip.length)return{eb:'In progress',ico:'🔨',t:ip[0].title,d:'Keep this task moving — mark it complete when done.',target:'mytasks',label:'Open task'};
  const um=nextMeeting();if(um&&um.date<=ymd(new Date(Date.now()+2*86400000)))return{eb:'Upcoming meeting',ico:'📅',t:um.title,d:'On '+new Date(um.date+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+(um.startTime?' at '+um.startTime:'')+'.',target:'calendar',label:'View'};
  if(!TEAM.psId) return{eb:'Set up',ico:'🎯',t:'Choose your problem statement',d:'Enter your PS ID and its live submission count so we can gauge your odds.',target:'setup',focus:'psId',label:'Continue'};
  if(!TEAM.wantsLeader&&!TEAM.ideaName) return{eb:'Set up',ico:'💡',t:'Lock your primary idea',d:'Pick the idea your team will build from the arsenal.',target:'setup',focus:'idea',label:'Continue'};
  if(SUBS.some(s=>s.status==='changes')) return{eb:'Action needed',ico:'📝',t:'Review feedback & resubmit',d:'The core team requested changes on a target. Address it and resubmit.',target:'tasks',label:'Continue'};
  if(SUBS.length===0) return{eb:'Build',ico:'🚀',t:'Submit your first target',d:'Ship the hero feature and submit Week-by-week progress for review.',target:'tasks',label:'Continue'};
  if(c.approved<c.total) return{eb:'Keep moving',ico:'📈',t:'Submit your next target',d:c.approved+' of '+c.total+' targets approved. Push the next milestone.',target:'tasks',label:'Continue'};
  return{eb:'On track',ico:'🏆',t:"You're all caught up",d:'Every target is approved. Polish the demo and prep for finals.',target:'chat',label:'Open chat'};
}

function activity(){
  const acts=[];
  SUBS.forEach(s=>{const m=MILES.find(x=>x.id===s.milestoneId);const nm=m?('Week '+m.week+' · '+m.title):'a target';
    if(s.reviewedAt&&(s.status==='approved'||s.status==='changes'))acts.push({ico:s.status==='approved'?'✅':'📝',t:'<b>Core team</b> '+(s.status==='approved'?'approved':'requested changes on')+' '+esc(nm),at:s.reviewedAt});
    if(s.updatedAt)acts.push({ico:'📤',t:esc(s.by||'A teammate')+' submitted '+esc(nm),at:s.updatedAt});});
  (TEAM.directives||[]).forEach(d=>acts.push({ico:'🎯',t:'<b>Core team</b> set a target: '+esc(d.text),at:d.at}));
  return acts.sort((a,b)=>b.at-a.at).slice(0,6);
}

function upcoming(){
  const list=[];
  MILES.forEach(m=>{const s=subFor(m.id);if(!s||s.status==='changes')list.push({wk:m.week,t:m.title,ask:m.asks});});
  return list.slice(0,4);
}

/* ---------- tasks (Phase 2) ---------- */
const TS_DONE=['COMPLETED','VERIFIED'],TS_OPEN=['PENDING_ACCEPTANCE','ACCEPTED','IN_PROGRESS'];
function isOverdue(t){if(!t.deadline||!TS_OPEN.includes(t.status))return false;const d=new Date(t.deadline+'T23:59:59');return !isNaN(d)&&d.getTime()<Date.now();}
function dlLabel(t){if(!t.deadline)return{txt:'No deadline',cls:''};const d=new Date(t.deadline+'T23:59:59');if(isNaN(d))return{txt:esc(t.deadline),cls:''};
  const days=Math.ceil((d.getTime()-Date.now())/86400000);let txt,cls='';
  if(TS_OPEN.includes(t.status)&&days<0){txt='Overdue '+(-days)+'d';cls='over';}
  else if(days===0){txt='Due today';cls='soon';}else if(days===1){txt='Due tomorrow';cls='soon';}
  else if(days>0&&days<=3){txt='Due in '+days+'d';cls='soon';}
  else txt=d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  return{txt,cls};}
function myTasks(){return TASKS.filter(t=>t.assignedTo===ME.id&&t.status!=='CANCELLED');}
function taskStats(){const mt=myTasks();const s={total:mt.length,pending:0,active:0,done:0,overdue:0};
  mt.forEach(t=>{if(t.status==='PENDING_ACCEPTANCE')s.pending++;else if(t.status==='ACCEPTED'||t.status==='IN_PROGRESS')s.active++;else if(TS_DONE.includes(t.status))s.done++;if(isOverdue(t))s.overdue++;});return s;}
function statusLabel(s){return s.charAt(0)+s.slice(1).toLowerCase().replace(/_/g,' ');}

function taskRow(t){const dl=dlLabel(t);return '<div class="trow taskrow" data-topen="'+t.id+'"><div class="top">'+
  '<span class="prio p-'+t.priority+'">'+t.priority.slice(0,4)+'</span>'+
  '<span class="ti">'+esc(t.title)+'</span>'+
  '<span class="tstat s-'+t.status+'">'+statusLabel(t.status)+'</span>'+
  '<span class="dl '+dl.cls+'">'+dl.txt+'</span></div></div>';}

function buildMyTasksCard(col){const mt=myTasks().slice().sort((a,b)=>{const ra=isOverdue(a)?0:(a.status==='PENDING_ACCEPTANCE'?1:2),rb=isOverdue(b)?0:(b.status==='PENDING_ACCEPTANCE'?1:2);return ra-rb;});
  const list=mt.length?mt.map(taskRow).join(''):'<div class="emptytask">No tasks assigned to you yet.</div>';
  return '<div class="cc '+(col||'col7')+'" id="mytasks"><h3 class="t"><span class="ico">📥</span> My tasks <span style="margin-left:auto;font-weight:700;color:var(--sub);text-transform:none;letter-spacing:0;font-size:12px">'+mt.length+' assigned</span></h3><div class="tlist">'+list+'</div></div>';}

function buildTeamTasksCard(){
  const opts=TASKMETA.members.map(m=>'<option value="'+m.id+'">'+esc(m.name)+(m.isLeader?' (leader)':'')+'</option>').join('');
  const all=TASKS.filter(t=>t.status!=='CANCELLED').slice().sort((a,b)=>b.createdAt-a.createdAt);
  const list=all.length?all.map(t=>{const dl=dlLabel(t);return '<div class="trow taskrow" data-topen="'+t.id+'"><div class="top"><span class="prio p-'+t.priority+'">'+t.priority.slice(0,4)+'</span><span class="ti">'+esc(t.title)+'</span><span class="tstat s-'+t.status+'">'+statusLabel(t.status)+'</span></div><div style="font-size:11.5px;color:var(--mut);margin-top:5px">→ '+esc(t.assignedToName||'unassigned')+(t.status==='REJECTED'&&t.rejectionReason?' · rejected: '+esc(t.rejectionReason):'')+' · <span class="'+dl.cls+'">'+dl.txt+'</span></div></div>';}).join(''):'<div class="emptytask">No team tasks yet. Assign the first one below.</div>';
  return '<div class="cc col5" id="assign"><h3 class="t"><span class="ico">🧩</span> Assign & track (leader)</h3>'+
    '<form class="assignform" id="assignForm"><input class="full" id="atTitle" placeholder="Task title" style="font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px"/>'+
      '<select id="atWho" style="font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px">'+opts+'</select>'+
      '<select id="atPrio" style="font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select>'+
      '<input class="full" id="atDeadline" type="date" style="font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px"/>'+
      '<textarea class="full" id="atDesc" placeholder="Description (optional)" style="font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;min-height:56px;resize:vertical"></textarea>'+
      '<button class="b pri full" type="submit">Assign task</button><div class="err full" id="atErr"></div></form>'+
    '<div class="tlist">'+list+'</div></div>';}

function openTaskModal(id){const t=TASKS.find(x=>x.id===id);if(!t)return;
  const mine=t.assignedTo===ME.id,leader=TASKMETA.isLeader;const dl=dlLabel(t);
  let acts='';
  if(mine&&t.status==='PENDING_ACCEPTANCE')acts='<button class="b ok" data-tact="accept" data-tid="'+t.id+'">Accept</button><button class="b danger" data-tact="rejectPrompt" data-tid="'+t.id+'">Reject</button>';
  else if(mine&&t.status==='ACCEPTED')acts='<button class="b pri" data-tact="start" data-tid="'+t.id+'">Start work</button>';
  else if(mine&&t.status==='IN_PROGRESS')acts='<button class="b ok" data-tact="complete" data-tid="'+t.id+'">Mark complete</button>';
  if(leader&&t.status==='COMPLETED')acts+='<button class="b ok" data-tact="verify" data-tid="'+t.id+'">Verify</button>';
  if(leader&&['REJECTED','PENDING_ACCEPTANCE'].includes(t.status))acts+='<button class="b" data-tact="reassignPrompt" data-tid="'+t.id+'">Reassign</button>';
  if(leader&&t.status!=='CANCELLED'&&t.status!=='VERIFIED')acts+='<button class="b danger" data-tact="cancel" data-tid="'+t.id+'">Cancel task</button>';
  const rej=t.rejectionReason?'<div class="mrow"><span class="k">Rejection reason</span><span class="v" style="max-width:60%;color:#B91C1C">'+esc(t.rejectionReason)+'</span></div>':'';
  document.getElementById('modalRoot').innerHTML='<div class="overlay" id="tOverlay"><div class="modal">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="prio p-'+t.priority+'">'+t.priority+'</span><span class="tstat s-'+t.status+'">'+statusLabel(t.status)+'</span><span class="dl '+dl.cls+'" style="margin-left:auto">'+dl.txt+'</span></div>'+
    '<h2 style="font-size:20px;margin:6px 0 10px;color:var(--ink)">'+esc(t.title)+'</h2>'+

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Su','Mo','Tu','We','Th','Fr','Sa'];
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function calEvents(){const ev=[];
  MEETINGS.filter(m=>m.status!=='cancelled'&&m.date).forEach(m=>ev.push({date:m.date,type:'meeting',title:m.title,time:m.startTime,id:m.id,ref:'meeting'}));
  TASKS.filter(t=>t.deadline&&TS_OPEN.includes(t.status)).forEach(t=>ev.push({date:t.deadline,type:isOverdue(t)?'overdue':'task',title:t.title,id:t.id,ref:'task'}));
  return ev;}
function eventsByDate(){const map={};calEvents().forEach(e=>{(map[e.date]=map[e.date]||[]).push(e);});return map;}
function nextMeeting(){const today=ymd(new Date());return MEETINGS.filter(m=>m.status!=='cancelled'&&m.date>=today).sort((a,b)=>(a.date+(a.startTime||'')).localeCompare(b.date+(b.startTime||'')))[0]||null;}
function upcomingMeetingCount(){const today=ymd(new Date());return MEETINGS.filter(m=>m.status!=='cancelled'&&m.date>=today).length;}

function renderCalendar(){const body=document.getElementById('calBody');if(!body||!CAL)return;
  const map=eventsByDate();const today=ymd(new Date());
  if(CAL.view==='month'){
    const first=new Date(CAL.y,CAL.m,1);const start=first.getDay();const days=new Date(CAL.y,CAL.m+1,0).getDate();
    let cells='';for(let i=0;i<7;i++)cells+='<div class="caldow">'+DOW[i]+'</div>';
    for(let i=0;i<start;i++)cells+='<div class="calcell pad"></div>';
    for(let d=1;d<=days;d++){const ds=CAL.y+'-'+String(CAL.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const evs=map[ds]||[];const types=[...new Set(evs.map(e=>e.type))];
      const dots=types.slice(0,3).map(t=>'<span class="caldot '+t+'"></span>').join('');
      cells+='<div class="calcell'+(ds===today?' today':'')+(evs.length?' has':'')+(CAL.sel===ds?' sel':'')+'"'+(evs.length?' data-calday="'+ds+'"':'')+'>'+d+'<div class="caldots">'+dots+'</div></div>';}
    body.innerHTML='<div class="calgrid">'+cells+'</div>'+
      (CAL.sel&&map[CAL.sel]?'<div class="agenda" style="margin-top:10px">'+dayAgenda(CAL.sel,map[CAL.sel])+'</div>':'<div class="faint" style="font-size:12px;text-align:center;margin-top:10px;color:var(--mut)">Tap a highlighted day to see its events.</div>');
    body.querySelectorAll('[data-calday]').forEach(c=>c.addEventListener('click',()=>{CAL.sel=c.dataset.calday;renderCalendar();}));
  }else{
    const all=calEvents().filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
    if(!all.length){body.innerHTML='<div class="emptytask">No upcoming meetings or deadlines.</div>';}
    else{const groups={};all.forEach(e=>{(groups[e.date]=groups[e.date]||[]).push(e);});
      body.innerHTML='<div class="agenda">'+Object.keys(groups).sort().map(d=>{
        const dd=new Date(d+'T00:00:00');const lbl=dd.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})+(d===today?' · Today':'');
        return '<div class="agday">'+lbl+'</div>'+dayAgenda(d,groups[d]);}).join('')+'</div>';}
  }
  bindAgenda(body);}
function dayAgenda(date,evs){return evs.map(e=>{const meta=e.ref==='meeting'?(e.time?e.time:'Meeting'):(e.type==='overdue'?'Overdue':'Due');
  return '<div class="agitem" data-calev="'+e.ref+':'+e.id+'"><span class="ad '+e.type+'"></span><span class="at">'+esc(e.title)+'</span><span class="am">'+meta+'</span></div>';}).join('');}
function bindAgenda(scope){scope.querySelectorAll('[data-calev]').forEach(it=>it.addEventListener('click',()=>{const[ref,id]=it.dataset.calev.split(':');if(ref==='meeting')openMeetingModal(parseInt(id,10));else openTaskModal(parseInt(id,10));}));}

  // announcements = directives (real)
  const dirs=(TEAM.directives||[]);
  const annHtml=dirs.length?dirs.map(d=>'<div class="fi'+(d.done?'':' unread')+'"><div class="fd">🎯</div><div class="ft">'+esc(d.text)+'<div class="fm">— '+esc(d.by)+' · '+timeAgo(d.at)+(d.done?' · done':'')+'</div></div>'+(d.done?'':'<button class="b sm" data-ack="'+d.id+'">Done</button>')+'</div>').join(''):'<div class="empty">No targets from the core team yet.</div>';

  const actHtml=activity().length?activity().map(a=>'<div class="fi"><div class="fd">'+a.ico+'</div><div class="ft">'+a.t+'<div class="fm">'+timeAgo(a.at)+'</div></div></div>').join(''):'<div class="empty">Activity will appear as your team makes progress.</div>';
  const upHtml=upcoming().length?upcoming().map(u=>'<div class="fi"><div class="fd">📅</div><div class="ft"><b>Week '+u.wk+'</b> · '+esc(u.t)+'<div class="fm">Expected: '+esc(u.ask)+'</div></div></div>').join(''):'<div class="empty">All targets complete 🎉</div>';

  // Upcoming deadlines — real data: open tasks (with deadline) + upcoming meetings, colour-coded by proximity
  const todayStr=ymd(new Date());
  const dItems=[];
  myTasks().filter(t=>t.deadline&&TS_OPEN.includes(t.status)).forEach(t=>{const d=new Date(t.deadline+'T23:59:59');const days=Math.ceil((d.getTime()-Date.now())/86400000);dItems.push({date:t.deadline,title:t.title,kind:'Task',days,cls:isOverdue(t)?'over':(days<=3?'soon':'norm')});});
  MEETINGS.filter(m=>m.status!=='cancelled'&&m.date>=todayStr).forEach(m=>{const days=Math.ceil((new Date(m.date+'T23:59:59').getTime()-Date.now())/86400000);dItems.push({date:m.date,title:m.title,kind:'Meeting',days,cls:'meet',time:m.startTime});});
  dItems.sort((a,b)=>a.date.localeCompare(b.date));
  function dWhen(x){if(x.cls==='over')return 'Overdue '+(-x.days)+'d';if(x.days===0)return 'Today';if(x.days===1)return 'Tomorrow';if(x.days<=6)return 'In '+x.days+'d';return new Date(x.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
  const dlHtml=dItems.length?dItems.slice(0,6).map(x=>'<div class="dlrow"><span class="dldot '+x.cls+'"></span><div class="dlbody"><div class="dltitle">'+esc(x.title)+'</div><div class="dlmeta">'+x.kind+(x.time?' · '+esc(x.time):'')+'</div></div><div class="dlwhen '+x.cls+'">'+dWhen(x)+'</div></div>').join(''):'<div class="empty">No upcoming deadlines.</div>';

  const unread=CONN&&CONN.conversations&&CONN.conversations[0]?CONN.conversations[0].unread:0;
  const lastMsg=CONN&&CONN.conversations&&CONN.conversations[0]?CONN.conversations[0].lastText:'';

  // invite (captain only) — keeps team password display + copy
  const inviteCard = ME.isCaptain ? '<div class="cc col12" style="border-color:var(--blue);background:linear-gradient(120deg,var(--blue-soft),var(--card) 60%)"><h3 class="t"><span class="ico">🎟️</span> Invite your 5 team members</h3>'+
      '<p style="font-size:13px;color:var(--sub);margin:0 0 10px">Share these with your teammates. They open the site → <b>Join team</b> tab → enter these to join and chat.</p>'+
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="cred">Team ID: '+esc(TEAM.teamCode)+'</span><span class="cred">Password: '+esc(TEAM.teamPassword||'')+'</span><button class="b sm" id="copyInvite">Copy invite</button></div></div>' : '';

  const overviewCard=
    '<div class="cc ov"><div><h2>'+hi+', '+esc(ME.name.split(' ')[0])+'.</h2><div class="sub">Stage: <b style="color:#fff">'+currentStageName()+'</b> · '+esc(TEAM.teamName)+'</div></div>'+
      '<div class="ovstats"><div class="ovs"><div class="k">Team</div><div class="v">'+esc(TEAM.teamName)+'</div></div>'+
        '<div class="ovs"><div class="k">Team ID</div><div class="v">'+esc(TEAM.teamCode)+'</div></div>'+
        '<div class="ovs ovprog"><div class="k">Overall progress</div><div class="v">'+c.approved+'/'+c.total+' targets</div><div class="ovbar"><i style="width:'+c.pct+'%"></i></div></div></div></div>';
  const statRow=
    '<div class="cc tight"><div class="statrow">'+
      '<div class="stat"><div class="v">'+ts.total+'</div><div class="k">My tasks</div></div>'+
      '<div class="stat up"><div class="v">'+ts.pending+'</div><div class="k">To accept</div></div>'+
      '<div class="stat up"><div class="v">'+ts.active+'</div><div class="k">In progress</div></div>'+
      '<div class="stat dn"><div class="v">'+ts.done+'</div><div class="k">Completed</div></div>'+
      '<div class="stat ov"><div class="v">'+ts.overdue+'</div><div class="k">Overdue</div></div>'+
      '<div class="stat"><div class="v">'+upcomingMeetingCount()+'</div><div class="k">Meetings</div></div>'+'</div></div>';
  const nextMoveCard=
    '<div class="cc nm"><div class="ring">'+nm.ico+'</div><div><div class="eb">Your next move</div><h2>'+nm.t+'</h2><p>'+nm.d+'</p></div>'+
      '<div class="go"><button class="b pri" id="nmBtn">'+nm.label+' →</button></div></div>';
  const journeyCard=
    '<div class="cc"><h3 class="t"><span class="ico">🧭</span> Your SIH journey</h3><div class="jour">'+jhtml+'</div></div>';
  const eightWeekCard=
    '<div class="cc" id="tasks"><h3 class="t"><span class="ico">🗂️</span> 8-week targets <span style="margin-left:auto;font-weight:700;color:var(--sub);text-transform:none;letter-spacing:0;font-size:12px">'+c.approved+' / '+c.total+' approved</span></h3>'+
      '<div class="tfilter"><button class="on" data-f="all">All</button><button data-f="todo">To do ('+gc.todo+')</button><button data-f="prog">In progress ('+(gc.prog)+')</button><button data-f="chg">Needs fix ('+gc.chg+')</button><button data-f="done">Done ('+gc.done+')</button></div>'+
      '<div class="tlist" id="tlist">'+tlistHtml+'</div></div>';
  const teamHubCard=
    '<div class="cc" id="team"><h3 class="t"><span class="ico">👥</span> Team hub</h3><div class="avatars">'+avs+'</div>'+
      '<div class="kv"><span class="k">Team name</span><span class="v">'+esc(TEAM.teamName)+'</span></div>'+
      '<div class="kv"><span class="k">Team ID</span><span class="v">'+esc(TEAM.teamCode)+'</span></div>'+
      (ME.loginId?'<div class="kv"><span class="k">Your Login ID</span><span class="v cred" style="font-weight:700">'+esc(ME.loginId)+'</span></div>':'')+
      '<div class="kv"><span class="k">Captain</span><span class="v">'+esc(capName)+'</span></div>'+
      '<div class="kv"><span class="k">Members</span><span class="v">'+teamSize()+' / 6</span></div>'+
      '<div class="kv"><span class="k">Domain</span><span class="v">'+esc(domain)+'</span></div>'+
      (ME.skills?'<div class="kv"><span class="k">Your skills</span><span class="v" style="max-width:60%">'+esc(ME.skills)+'</span></div>':'')+'</div>';
  const missionSetupCard=
    '<div class="cc" id="setup"><h3 class="t"><span class="ico">⚙️</span> Mission setup <span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--mut)">(anyone on the team can edit)</span></h3>'+
      '<div class="fgrid"><div class="fld"><label>Team name</label><input id="teamName" value="'+esc(TEAM.teamName||'')+'"/></div>'+ideaSetup+
        '<div class="fld"><label>Problem Statement ID</label><input id="psId" value="'+esc(TEAM.psId||'')+'" placeholder="SIH26XXXX"/></div>'+
        '<div class="fld"><label>Live submissions on that PS</label><input id="psCount" type="number" min="0" value="'+(TEAM.psCount==null?'':TEAM.psCount)+'" placeholder="from portal"/></div>'+
        '<div class="fld"><label>Members (up to 6)</label><input id="members" value="'+esc((TEAM.members||[]).join(', '))+'"/></div>'+
        '<div class="fld"><label>Female members (≥1)</label><input id="fcount" type="number" min="0" max="6" value="'+(TEAM.femaleCount||0)+'"/></div></div>'+
      '<button class="b pri" id="saveTeam" style="margin-top:14px">Save setup</button><div class="err" id="tErr"></div></div>';
  const announcementsCard=
    '<div class="cc"><h3 class="t"><span class="ico">📢</span> Announcements &amp; targets</h3><div class="feed">'+annHtml+'</div></div>';
  const activityCard=
    '<div class="cc"><h3 class="t"><span class="ico">⚡</span> Recent activity</h3><div class="feed">'+actHtml+'</div></div>';
  const deadlinesCard=
    '<div class="cc"><h3 class="t"><span class="ico">⏰</span> Upcoming deadlines</h3><div class="dllist">'+dlHtml+'</div></div>';
  const challengeCard=
    '<div class="cc"><h3 class="t"><span class="ico">🎯</span> Your challenge</h3>'+
      '<div style="font-size:16px;font-weight:800;color:var(--ink);margin-bottom:2px">'+esc(problemName)+'</div>'+
      '<div class="tags"><span class="tag">'+esc(domain)+'</span>'+(TEAM.psId?'<span class="tag">PS '+esc(TEAM.psId)+'</span>':'')+'<span class="tag">'+(TEAM.psId?'Locked in':'Not chosen')+'</span></div>'+
      (idea&&idea.edge?'<p style="font-size:12.5px;color:var(--sub);margin:10px 0 0;line-height:1.5">'+esc(idea.edge)+'</p>':'')+
      '<div style="margin-top:12px"><a class="b sm" href="#setup">Edit in setup →</a></div></div>';
  const readinessCard=
    '<div class="cc"><h3 class="t"><span class="ico">✅</span> Team readiness <span style="margin-left:auto;font-weight:800;color:var(--ink);text-transform:none;letter-spacing:0">'+rd.pct+'%</span></h3><div class="miniprog"><i style="width:'+rd.pct+'%"></i></div>'+
      '<div class="chk">'+rd.items.map(it=>'<div class="it '+(it.on?'on':'off')+'"><span class="bx">✓</span>'+it.lb+'</div>').join('')+'</div></div>';
  const oddsCard=
    '<div class="cc"><h3 class="t"><span class="ico">📡</span> Selection odds</h3><div class="odds"><div class="big" id="oBig" style="color:'+o.c+'">'+o.big+'</div><div class="lb">chance to reach finale</div><div class="prog"><i id="oBar" style="width:'+o.w+'%"></i></div><div class="pv" id="oV" style="color:'+o.c+'">'+o.t+'</div></div></div>';
  const chatCard=
    '<div class="cc" id="chat"><h3 class="t"><span class="ico">💬</span> Team chat'+(unread?' <span style="background:var(--blue);color:#fff;border-radius:99px;padding:1px 7px;font-size:10px;margin-left:2px">'+unread+'</span>':'')+' <a class="lnk" href="/connect.html">Open →</a></h3>'+
      '<div class="chatbox"><div class="msgs" id="msgs"></div><form class="chatform" id="chatForm"><input id="chatInput" placeholder="Message your team…" autocomplete="off"/><button class="b pri" type="submit">Send</button></form></div></div>';
  const quickActionsCard=
    '<div class="cc"><h3 class="t"><span class="ico">⚡</span> Quick actions</h3><div class="qa" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">'+
      '<a href="/connect.html"><span class="qi">💬</span><span class="ql">Open chat</span></a>'+
      '<a href="#team"><span class="qi">👥</span><span class="ql">View team</span></a>'+
      '<a href="#tasks"><span class="qi">🗂️</span><span class="ql">View tasks</span></a>'+
      '<a href="#setup"><span class="qi">🎯</span><span class="ql">Problem</span></a>'+
      '<a href="#resources"><span class="qi">📚</span><span class="ql">Resources</span></a>'+
      '<a href="/#faq"><span class="qi">🛟</span><span class="ql">Support</span></a>'+'</div></div>';
  const resourcesCard=
    '<div class="cc" id="resources"><h3 class="t"><span class="ico">📚</span> Resources</h3><div class="qa" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">'+
      '<a href="https://sih.gov.in" target="_blank" rel="noopener"><span class="qi">🏛️</span><span class="ql">SIH Portal</span></a>'+
      '<a href="https://sih.gov.in/sih2024PS" target="_blank" rel="noopener"><span class="qi">📄</span><span class="ql">Problem Statements</span></a>'+
      '<a href="/#journey"><span class="qi">🗺️</span><span class="ql">Campaign Guide</span></a>'+
      '<a href="/#faq"><span class="qi">❓</span><span class="ql">FAQ</span></a>'+
      '<a href="#tasks"><span class="qi">📊</span><span class="ql">Submission Guide</span></a>'+
      '<a href="/connect.html"><span class="qi">💬</span><span class="ql">Ask Core Team</span></a>'+'</div></div>';
  const supportCard=
    '<div class="cc"><h3 class="t"><span class="ico">🛟</span> Need help?</h3><div class="feed">'+
      '<a class="fi" style="text-decoration:none" href="/#faq"><div class="fd">❓</div><div class="ft" style="color:var(--ink)">FAQ<div class="fm">Common questions</div></div></a>'+
      '<a class="fi" style="text-decoration:none" href="/connect.html"><div class="fd">💬</div><div class="ft" style="color:var(--ink)">Contact core team<div class="fm">Chat with mentors</div></div></a>'+
      '<a class="fi" style="text-decoration:none" href="#chat"><div class="fd">🐞</div><div class="ft" style="color:var(--ink)">Report an issue<div class="fm">Message us here</div></div></a>'+
      '<a class="fi" style="text-decoration:none" href="/#journey"><div class="fd">📖</div><div class="ft" style="color:var(--ink)">Platform guide<div class="fm">How it works</div></div></a>'+'</div></div>';

  app.innerHTML=
    '<div class="ccstack">'+
      overviewCard+ statRow+ nextMoveCard+ journeyCard+
      '<div class="maincols">'+
        '<div class="mcleft">'+ taskCards+ eightWeekCard+ announcementsCard+ activityCard+ teamHubCard+ missionSetupCard+ '</div>'+
        '<div class="mcright">'+ buildCalendarCard()+ deadlinesCard+ challengeCard+ readinessCard+ oddsCard+ chatCard+ '</div>'+
      '</div>'+
      quickActionsCard+ inviteCard+
      '<div class="reshelp">'+ resourcesCard+ supportCard+ '</div>'+
    '</div>';

  // ---- bind (all existing handlers preserved) ----
  if(!TEAM.wantsLeader){fillIdeas(document.getElementById('idea'),TEAM.ideaId);fillIdeas(document.getElementById('backup'),TEAM.backupIdeaId);}
  document.getElementById('nmBtn').addEventListener('click',()=>{const el=document.getElementById(nm.target);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});}if(nm.focus){const f=document.getElementById(nm.focus);if(f)setTimeout(()=>f.focus(),350);}});
  const copyBtn=document.getElementById('copyInvite');if(copyBtn)copyBtn.addEventListener('click',()=>{const txt='Join our SIH team on '+location.origin+'/?join\nTeam ID: '+TEAM.teamCode+'\nPassword: '+(TEAM.teamPassword||'');navigator.clipboard&&navigator.clipboard.writeText(txt);toast('Invite copied');});
  document.getElementById('psCount').addEventListener('input',e=>{TEAM.psCount=e.target.value===''?null:Number(e.target.value);const o=odds();oBig.textContent=o.big;oBig.style.color=o.c;oBar.style.width=o.w+'%';oV.textContent=o.t;oV.style.color=o.c;});
  document.getElementById('saveTeam').addEventListener('click',async()=>{
    const err=document.getElementById('tErr');err.textContent='';
    const body={teamName:teamName.value,psId:psId.value,psCount:psCount.value,members:members.value.split(',').map(s=>s.trim()).filter(Boolean),femaleCount:fcount.value};
    if(!TEAM.wantsLeader){body.ideaId=document.getElementById('idea').value;body.backupIdeaId=document.getElementById('backup').value;}
    try{const d=await api('/api/my/team',{method:'PUT',body:JSON.stringify(body)});TEAM=d.team;toast('Saved ✓');render();}catch(ex){err.textContent=ex.message;}
  });
  document.querySelectorAll('.trow .top[data-open]').forEach(t=>t.addEventListener('click',()=>{const id=t.dataset.open;document.getElementById('b-'+id).classList.toggle('cc-hidden');t.closest('.trow').classList.toggle('open');}));
  document.querySelectorAll('.tfilter button').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.tfilter button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');
    const f=btn.dataset.f;document.querySelectorAll('#tlist .trow').forEach(r=>{r.style.display=(f==='all'||r.dataset.grp===f)?'':'none';});}));
  MILES.forEach(m=>{const f=document.getElementById('f-'+m.id);if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();const er=f.querySelector('.err');er.textContent='';const fd=new FormData(f);try{const d=await api('/api/my/submission',{method:'POST',body:JSON.stringify({milestoneId:m.id,github:fd.get('github'),deck:fd.get('deck'),demo:fd.get('demo'),live:fd.get('live'),notes:fd.get('notes')})});SUBS=SUBS.filter(s=>s.milestoneId!==m.id);SUBS.push(d.submission);render();toast('Submitted ✓');}catch(ex){er.textContent=ex.message;}});});
  document.querySelectorAll('[data-ack]').forEach(b=>b.addEventListener('click',async()=>{await api('/api/my/directive/'+b.dataset.ack+'/ack',{method:'POST'});const dd=TEAM.directives.find(x=>x.id==b.dataset.ack);if(dd)dd.done=true;render();}));
  document.getElementById('chatForm').addEventListener('submit',async e=>{e.preventDefault();const inp=document.getElementById('chatInput');const t=inp.value.trim();if(!t)return;inp.value='';try{await api('/api/my/comment',{method:'POST',body:JSON.stringify({text:t})});await loadChat();}catch(ex){toast(ex.message);}});
  document.querySelectorAll('.taskrow').forEach(r=>r.addEventListener('click',()=>openTaskModal(parseInt(r.dataset.topen,10))));
  wireCalendar();
  const af=document.getElementById('assignForm');
  if(af)af.addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('atErr');err.textContent='';
    const body={title:document.getElementById('atTitle').value,assignedTo:document.getElementById('atWho').value,priority:document.getElementById('atPrio').value,deadline:document.getElementById('atDeadline').value,description:document.getElementById('atDesc').value};
    try{await api('/api/tasks',{method:'POST',body:JSON.stringify(body)});await loadTasks();render();toast('Task assigned ✓');}catch(ex){err.textContent=ex.message;}});
  loadChat();
  if(chatTimer)clearInterval(chatTimer);chatTimer=setInterval(loadChat,8000);
}

async function boot(){
  const d=await api('/api/my').catch(()=>({user:null}));
  if(!d.user){location.href='/apply.html?login';return;}
  if(d.user.role==='admin'||d.user.role==='lead'){location.href='/admin.html';return;}
  ME=d.user;TEAM=d.team;
  if(ME.isCaptain && !ME.signedAgreement){IDEAS=await api('/api/ideas');MILES=await api('/api/milestones');showAgreement();return;}
  if(!TEAM){location.href='/status.html';return;}
  IDEAS=await api('/api/ideas');MILES=await api('/api/milestones');SUBS=await api('/api/my/submissions');
  CONN=await api('/api/connect/summary').catch(()=>null);
  await loadTasks();await loadMeetings();
  render();
  startSSE();
}
boot();
</script>
</body>
</html>
