<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Command Center — SIH 2026</title>
<link rel="stylesheet" href="/app.css" />
<style>
  /* ============ SIH 2026 · Student Command Center ============
     Skin only — reuses app.css tokens. No logic/API/field changes. */
  :root{
    --navy:#0B1220; --blue:#2563EB; --blue-d:#1D4ED8; --blue-soft:#EAF1FF;
    --saffron:#D97706; --saffron-soft:#FFF4E5; --ok:#16A34A; --ok-soft:#EAF8EF;
    --ink:#101828; --sub:#667085; --mut:#98A2B3; --bd:#E4E7EC; --bd2:#EEF0F3;
    --wbg:#F7F7F5; --card:#FFFFFF;
  }
  body{background:var(--wbg)}
  .cc-hidden{display:none!important}

  /* ---- header ---- */
  .cchead{position:sticky;top:0;z-index:40;background:rgba(247,247,245,.85);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
  .cchead .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;
    padding:12px clamp(16px,4vw,28px)}
  .ccbrand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;color:var(--ink);font-size:16px}
  .ccbrand .mk{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--saffron));display:inline-block}
  .ccbrand small{font-weight:600;font-size:11px;color:var(--sub);letter-spacing:.02em}
  .ccnav{display:flex;gap:2px;margin-left:12px}
  .ccnav a{font-size:13.5px;font-weight:600;color:var(--sub);padding:7px 12px;border-radius:9px;text-decoration:none;transition:.15s}
  .ccnav a:hover{color:var(--ink);background:var(--blue-soft)}
  .ccsp{flex:1}
  .icobtn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--bd);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:.15s}
  .icobtn:hover{border-color:var(--blue);background:var(--blue-soft)}
  .badge-dot{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--blue);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--wbg)}
  .ccprof{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--bd);border-radius:999px;background:var(--card);cursor:pointer;transition:.15s}
  .ccprof:hover{border-color:var(--blue)}
  .ccav{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .ccprof .nm{font-size:13px;font-weight:700;color:var(--ink);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ccmenubtn{display:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--bd);background:var(--card);align-items:center;justify-content:center;font-size:18px;cursor:pointer}
  .ccdrop{position:absolute;top:60px;right:clamp(16px,4vw,28px);background:var(--card);border:1px solid var(--bd);
    border-radius:14px;box-shadow:0 16px 40px rgba(16,24,40,.14);padding:6px;min-width:190px;z-index:50}
  .ccdrop a,.ccdrop button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;
    font-size:13.5px;font-weight:600;color:var(--ink);padding:10px 12px;border-radius:9px;cursor:pointer;text-decoration:none}
  .ccdrop a:hover,.ccdrop button:hover{background:var(--blue-soft);color:var(--blue-d)}
  .ccdrop .sep{height:1px;background:var(--bd2);margin:4px 6px}

  /* ---- shell / grid ---- */
  .ccwrap{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,28px) clamp(16px,4vw,28px) 60px}
  .ccgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
  .col12{grid-column:span 12}.col8{grid-column:span 8}.col6{grid-column:span 6}.col4{grid-column:span 4}
  @media(max-width:980px){.col8,.col6,.col4{grid-column:span 12}}

  /* ---- cards ---- */
  .cc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .cc.tight{padding:16px}
  .cc h3.t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .cc h3.t .ico{font-size:14px}
  .cc .lnk{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;text-transform:none;letter-spacing:0}
  .cc .lnk:hover{color:var(--blue-d)}

  /* overview */
  .ov{display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    background:linear-gradient(120deg,var(--navy),#141d31);border:1px solid var(--navy);color:#fff}
  .ov h2{font-size:clamp(19px,2.4vw,25px);font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .ov .sub{color:#AEB7C6;font-size:13.5px}
  .ov .ovstats{display:flex;gap:26px;flex-wrap:wrap;margin-left:auto}
  .ovs .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A94A6}
  .ovs .v{font-size:16px;font-weight:800;margin-top:3px;color:#fff;font-variant-numeric:tabular-nums}
  .ovprog{min-width:150px}
  .ovbar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:7px}
  .ovbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#60A5FA);border-radius:99px;transition:width .5s ease}

  /* next move */
  .nm{border:1px solid var(--blue);background:linear-gradient(120deg,var(--blue-soft),var(--card) 70%);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .nm .ring{width:52px;height:52px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
  .nm .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-d)}
  .nm h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:3px 0 2px;color:var(--ink)}
  .nm p{font-size:13.5px;color:var(--sub);margin:0}
  .nm .go{margin-left:auto}

  /* buttons (local, match app.css btn) */
  .b{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13.5px;font-weight:700;
    padding:10px 16px;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;transition:.15s}
  .b:hover{border-color:var(--blue);color:var(--blue-d)}
  .b.pri{background:var(--blue);border-color:var(--blue);color:#fff}
  .b.pri:hover{background:var(--blue-d);color:#fff}
  .b.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}

  /* journey stepper */
  .jour{display:flex;flex-wrap:wrap;gap:6px;overflow:hidden}
  .step{flex:1;min-width:76px;text-align:center;position:relative}
  .step .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;background:var(--bd2);color:var(--mut);border:2px solid var(--bd);position:relative}
  .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue-soft)}
  .step .lb{font-size:10.5px;font-weight:700;color:var(--mut);line-height:1.2}
  .step.done .lb{color:var(--ink)}.step.cur .lb{color:var(--blue-d)}
  .step .bar{position:absolute;top:12px;left:50%;width:100%;height:2px;background:var(--bd);z-index:-1}
  .step.done .bar{background:var(--ok)}

  /* readiness / checklist */
  .chk{display:flex;flex-direction:column;gap:8px}
  .chk .it{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink)}
  .chk .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:transparent}
  .chk .it.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
  .chk .it.off{color:var(--sub)}
  .rd-top{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .rd-top .pct{font-size:30px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .rd-top .lb{font-size:12px;color:var(--sub)}
  .miniprog{height:8px;border-radius:99px;background:var(--bd2);overflow:hidden;margin:2px 0 14px}
  .miniprog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#4ADE80);border-radius:99px;transition:width .5s}

  /* fields */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.fgrid{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--mut)}
  .fld input,.fld select,.fld textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .fld textarea{min-height:70px;resize:vertical}
  .err{color:#DC2626;font-size:12.5px;margin-top:6px;min-height:1em}

  /* tasks */
  .tcols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:820px){.tcols{grid-template-columns:1fr}}
  .tcol .hd{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;display:flex;align-items:center;gap:7px}
  .tcol .hd .cnt{background:var(--bd2);color:var(--sub);border-radius:99px;padding:1px 8px;font-size:11px}
  .tcol.todo .hd .cnt{background:var(--saffron-soft);color:var(--saffron)}
  .tcol.prog .hd .cnt{background:var(--blue-soft);color:var(--blue-d)}
  .tcol.done .hd .cnt{background:var(--ok-soft);color:var(--ok)}
  .task{border:1px solid var(--bd);border-radius:13px;padding:12px 13px;margin-bottom:10px;background:var(--card);transition:.15s}
  .task:hover{border-color:var(--bd2);box-shadow:0 6px 18px rgba(16,24,40,.06);transform:translateY(-1px)}
  .task .wk{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-d);background:var(--blue-soft);border-radius:6px;padding:2px 7px}
  .task h4{font-size:14px;font-weight:700;color:var(--ink);margin:8px 0 4px}
  .task .dt{font-size:12.5px;color:var(--sub);line-height:1.45}
  .task .ask{font-size:11.5px;color:var(--mut);margin-top:6px}
  .task .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .task .links a{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none}
  .task .fb{margin-top:8px;font-size:12.5px;background:var(--saffron-soft);border:1px solid #F3D9AE;color:#8A5A12;border-radius:9px;padding:8px 10px}
  .pill{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
  .pill.p-todo{background:var(--bd2);color:var(--sub)}
  .pill.p-sub{background:var(--blue-soft);color:var(--blue-d)}
  .pill.p-appr{background:var(--ok-soft);color:var(--ok)}
  .pill.p-chg{background:var(--saffron-soft);color:var(--saffron)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.row2{grid-template-columns:1fr}}

  /* team hub / avatars */
  .avatars{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid var(--card)}
  .av.cap{background:var(--navy)}
  .av.empty{background:var(--bd2);color:var(--mut);border:1px dashed var(--bd)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd2);font-size:13.5px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--sub)}.kv .v{color:var(--ink);font-weight:700;text-align:right}
  .cred{font-family:var(--mono,monospace);font-size:12.5px;background:var(--wbg);border:1px solid var(--bd);border-radius:8px;padding:4px 9px;color:var(--ink)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{font-size:11.5px;font-weight:600;color:var(--sub);background:var(--wbg);border:1px solid var(--bd);border-radius:7px;padding:3px 9px}

  /* chat */
  .chatbox{display:flex;flex-direction:column;height:320px}
  .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
  .msg{max-width:82%;padding:8px 12px;border-radius:13px;font-size:13.5px;line-height:1.45}
  .msg .a{font-size:11px;font-weight:700;margin-bottom:2px;display:flex;gap:6px;align-items:center}
  .msg.mine{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  .msg.mine .a{color:#fff;opacity:.9}
  .msg.other{align-self:flex-start;background:var(--wbg);border:1px solid var(--bd);border-bottom-left-radius:4px;color:var(--ink)}
  .msg.core{align-self:flex-start;background:var(--saffron-soft);border:1px solid #F3D9AE;color:#7A4E10}
  .msg .t{font-size:10px;opacity:.6;margin-top:3px}
  .cmini{font-size:9px;padding:1px 5px;border-radius:5px;font-weight:800}
  .cmini.core{background:#F3D9AE;color:#7A4E10}.cmini.cap{background:var(--navy);color:#fff}
  .chatform{display:flex;gap:8px;margin-top:10px}
  .chatform input{flex:1;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
  .chatform input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}

  /* announcements / activity / upcoming lists */
  .feed{display:flex;flex-direction:column;gap:2px}
  .fi{display:flex;gap:11px;padding:10px 2px;border-bottom:1px solid var(--bd2)}
  .fi:last-child{border-bottom:0}
  .fi .fd{width:30px;height:30px;border-radius:9px;background:var(--wbg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
  .fi .ft{flex:1;font-size:13px;color:var(--ink);line-height:1.4}
  .fi .fm{font-size:11.5px;color:var(--mut);margin-top:2px}
  .fi.unread{position:relative}
  .fi.unread::before{content:"";position:absolute;left:-6px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
  .empty{font-size:13px;color:var(--mut);text-align:center;padding:18px 0}

  /* quick actions */
  .qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:520px){.qa{grid-template-columns:repeat(2,1fr)}}
  .qa a{display:flex;flex-direction:column;gap:6px;padding:14px 12px;border:1px solid var(--bd);border-radius:13px;text-decoration:none;background:var(--card);transition:.15s}
  .qa a:hover{border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px)}
  .qa .qi{font-size:20px}
  .qa .ql{font-size:12.5px;font-weight:700;color:var(--ink)}

  /* odds mini */
  .odds{text-align:center}
  .odds .big{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .odds .lb{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:4px}
  .odds .pv{font-size:12.5px;font-weight:700;margin-top:8px}
  .prog{height:9px;border-radius:99px;background:var(--bd2);overflow:hidden;margin-top:8px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--saffron));border-radius:99px;transition:width .3s}

  @media(max-width:820px){
    .ccnav{display:none} .ccprof .nm{display:none} .ccmenubtn{display:flex}
    .ov .ovstats{margin-left:0;width:100%;justify-content:space-between;gap:14px}
  }
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 12px 30px rgba(16,24,40,.25);z-index:99}
  /* agreement modal reuse */
  .overlay{position:fixed;inset:0;background:rgba(11,18,32,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
  .modal{max-width:520px;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;max-height:90vh;overflow:auto}
  .agree{font-size:13.5px;color:var(--sub);line-height:1.6}.agree h4{color:var(--ink);margin:0 0 8px}.agree ol{margin:0;padding-left:18px}
  .checkline{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink);margin:14px 0}
</style>
</head>
<body>

<header class="cchead">
  <div class="in">
    <span class="ccbrand"><span class="mk"></span> SIH 2026 <small id="roleTag">Command Center</small></span>
    <nav class="ccnav">
      <a href="#top">Dashboard</a><a href="#team">Team</a><a href="#tasks">Tasks</a>
      <a href="#chat">Chat</a><a href="#resources">Resources</a>
    </nav>
    <span class="ccsp"></span>
    <button class="icobtn" id="bellBtn" title="Notifications">🔔<span class="badge-dot cc-hidden" id="bellCt">0</span></button>
    <div class="ccprof" id="profBtn"><span class="ccav" id="profAv">?</span><span class="nm" id="profNm">…</span></div>
    <button class="ccmenubtn" id="menuBtn">☰</button>
  </div>
</header>

<div class="ccwrap"><a id="top"></a>
  <div class="ccgrid" id="app"><div class="cc col12">Loading your command center…</div></div>
</div>
<div id="dropRoot"></div>
<div id="modalRoot"></div>

<script src="/route.js"></script>
<script>
async function api(u,o){const r=await fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},o));const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
function initials(n){return (n||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function timeAgo(ts){if(!ts)return'';const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
let ME=null,TEAM=null,IDEAS=[],MILES=[],SUBS=[],CONN=null,chatTimer=null;

/* ---------- agreement (unchanged flow) ---------- */
function agreementText(leader){
  if(leader) return '<h4>Participation Agreement (Idea Owner)</h4><ol><li>The idea I registered is my own original work and I <b>retain its ownership</b>.</li><li>I authorise the campaign to mentor and field this idea at SIH 2026.</li><li>My teammates contribute as members and make no ownership claim.</li><li>The core team may remove any participant for misconduct or inactivity.</li><li>I will represent the college professionally.</li></ol>';
  return '<h4>Idea &amp; Participation Agreement</h4><ol><li>The campaign problem ideas are the <b>intellectual property of the organiser</b>.</li><li>I join as a team member and claim <b>no ownership or commercial rights</b> over the idea.</li><li>I will not reuse or independently pursue this idea outside the campaign.</li><li>The core team may reassign or remove me for misconduct, inactivity or unwanted activity.</li><li>I will represent the college professionally.</li></ol>';
}
function showAgreement(){
  document.getElementById('modalRoot').innerHTML='<div class="overlay"><div class="modal">'+
    '<div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-d);font-weight:800">Team '+esc(TEAM?TEAM.teamCode:'')+' — before you enter</div>'+
    '<h2 style="font-size:22px;margin:8px 0 12px;color:var(--ink)">Sign the agreement</h2><div class="agree">'+agreementText(TEAM&&TEAM.wantsLeader)+'</div>'+
    '<label class="checkline"><input type="checkbox" id="agChk" /> <span>I have read and accept the above terms.</span></label>'+
    '<div class="fld"><label for="agName">Type your full name to sign</label><input id="agName" value="'+esc(ME.name)+'"/></div>'+
    '<button class="b pri" id="agBtn" style="width:100%;margin-top:14px;justify-content:center">Sign &amp; enter</button><div class="err" id="agErr"></div></div></div>';
  document.getElementById('agBtn').addEventListener('click',async()=>{
    const err=document.getElementById('agErr');err.textContent='';
    try{await api('/api/my/sign',{method:'POST',body:JSON.stringify({agree:document.getElementById('agChk').checked,signedName:document.getElementById('agName').value})});document.getElementById('modalRoot').innerHTML='';toast('Signed ✓ Welcome');boot();}
    catch(ex){err.textContent=ex.message;}
  });
}

function odds(){const n=TEAM&&TEAM.psCount?Number(TEAM.psCount):null;if(!n)return{t:'Enter your PS submission count',c:'var(--mut)',big:'—',w:0};const o=Math.min(100,5/n*100);let t,c;if(n<=60){t='OPEN SEAT — great pick';c='var(--ok)';}else if(n<=180){t='WORKABLE — build strong';c='var(--saffron)';}else if(n<=350){t='CROWDED — only if elite';c='var(--blue)';}else{t='NEAR-LOCKED — switch';c='#DC2626';}return{t,c,big:o.toFixed(1)+'%',w:Math.max(4,Math.min(100,(1-(n-5)/495)*100))};}

/* ---------- derived state (only real data) ---------- */
function subFor(mid){return SUBS.find(s=>s.milestoneId===mid)||null;}
function counts(){let approved=0,submitted=0,changes=0;MILES.forEach(m=>{const s=subFor(m.id);if(!s)return;if(s.status==='approved')approved++;else if(s.status==='submitted')submitted++;else if(s.status==='changes')changes++;});return{approved,submitted,changes,total:MILES.length,pct:MILES.length?Math.round(approved/MILES.length*100):0};}
function teamSize(){return (TEAM.memberAccounts?TEAM.memberAccounts.length:0)+1;}
function problemChosen(){return !!(TEAM.psId||TEAM.ideaName||(TEAM.wantsLeader&&TEAM.ownIdeaText));}

function journey(){
  const c=counts();const built=SUBS.length>0;const anyChg=SUBS.some(s=>s.status==='changes'||s.status==='submitted');
  const steps=[
    {lb:'Applied',done:true},
    {lb:'Selected',done:true},
    {lb:'Team formed',done:teamSize()>=2},
    {lb:'Problem chosen',done:problemChosen()},
    {lb:'Build',done:built},
    {lb:'Review',done:SUBS.some(s=>s.status==='approved'||s.status==='submitted')},
    {lb:'Submission',done:c.approved>=6},
    {lb:'Finals',done:false}
  ];
  let curSet=false;
  for(const s of steps){if(!s.done&&!curSet){s.cur=true;curSet=true;}}
  return steps;
}
function currentStageName(){const j=journey();const cur=j.find(s=>s.cur);return cur?cur.lb:'Finals ready';}

function readiness(){
  const c=counts();
  const items=[
    {lb:'Team formed',on:teamSize()>=2},
    {lb:'Team profile complete',on:!!(TEAM.teamName&&(TEAM.ideaName||TEAM.wantsLeader))},
    {lb:'Problem selected',on:!!TEAM.psId},
    {lb:'Prototype shipped',on:SUBS.some(s=>s.github||s.live)},
    {lb:'Reviewed by core team',on:SUBS.some(s=>s.status==='approved'||s.feedback)},
    {lb:'Portal submission',on:c.approved>=6}
  ];
  const on=items.filter(i=>i.on).length;
  return{items,pct:Math.round(on/items.length*100)};
}

function nextMove(){
  const c=counts();
  if(!TEAM.psId) return{eb:'Set up',ico:'🎯',t:'Choose your problem statement',d:'Enter your PS ID and its live submission count so we can gauge your odds.',target:'setup',focus:'psId',label:'Continue'};
  if(!TEAM.wantsLeader&&!TEAM.ideaName) return{eb:'Set up',ico:'💡',t:'Lock your primary idea',d:'Pick the idea your team will build from the arsenal.',target:'setup',focus:'idea',label:'Continue'};
  if(SUBS.some(s=>s.status==='changes')) return{eb:'Action needed',ico:'📝',t:'Review feedback & resubmit',d:'The core team requested changes on a target. Address it and resubmit.',target:'tasks',label:'Continue'};
  if(SUBS.length===0) return{eb:'Build',ico:'🚀',t:'Submit your first target',d:'Ship the hero feature and submit Week-by-week progress for review.',target:'tasks',label:'Continue'};
  if(c.approved<c.total) return{eb:'Keep moving',ico:'📈',t:'Submit your next target',d:c.approved+' of '+c.total+' targets approved. Push the next milestone.',target:'tasks',label:'Continue'};
  return{eb:'On track',ico:'🏆',t:"You're all caught up",d:'Every target is approved. Polish the demo and prep for finals.',target:'chat',label:'Open chat'};
}

function activity(){
  const acts=[];
  SUBS.forEach(s=>{const m=MILES.find(x=>x.id===s.milestoneId);const nm=m?('Week '+m.week+' · '+m.title):'a target';
    if(s.reviewedAt&&(s.status==='approved'||s.status==='changes'))acts.push({ico:s.status==='approved'?'✅':'📝',t:'<b>Core team</b> '+(s.status==='approved'?'approved':'requested changes on')+' '+esc(nm),at:s.reviewedAt});
    if(s.updatedAt)acts.push({ico:'📤',t:esc(s.by||'A teammate')+' submitted '+esc(nm),at:s.updatedAt});});
  (TEAM.directives||[]).forEach(d=>acts.push({ico:'🎯',t:'<b>Core team</b> set a target: '+esc(d.text),at:d.at}));
  return acts.sort((a,b)=>b.at-a.at).slice(0,6);
}

function upcoming(){
  const list=[];
  MILES.forEach(m=>{const s=subFor(m.id);if(!s||s.status==='changes')list.push({wk:m.week,t:m.title,ask:m.asks});});
  return list.slice(0,4);
}

    '<div class="cc col4"><h3 class="t"><span class="ico">🛟</span> Need help?</h3><div class="feed">'+
      '<a class="fi" style="text-decoration:none" href="/#faq"><div class="fd">❓</div><div class="ft" style="color:var(--ink)">FAQ<div class="fm">Common questions</div></div></a>'+
      '<a class="fi" style="text-decoration:none" href="/connect.html"><div class="fd">💬</div><div class="ft" style="color:var(--ink)">Contact core team<div class="fm">Chat with mentors</div></div></a>'+
      '<a class="fi" style="text-decoration:none" href="#chat"><div class="fd">🐞</div><div class="ft" style="color:var(--ink)">Report an issue<div class="fm">Message us here</div></div></a>'+
      '<a class="fi" style="text-decoration:none" href="/#journey"><div class="fd">📖</div><div class="ft" style="color:var(--ink)">Platform guide<div class="fm">How it works</div></div></a>'+'</div></div>';

  // ---- bind (all existing handlers preserved) ----
  if(!TEAM.wantsLeader){fillIdeas(document.getElementById('idea'),TEAM.ideaId);fillIdeas(document.getElementById('backup'),TEAM.backupIdeaId);}
  document.getElementById('nmBtn').addEventListener('click',()=>{const el=document.getElementById(nm.target);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});}if(nm.focus){const f=document.getElementById(nm.focus);if(f)setTimeout(()=>f.focus(),350);}});
  const copyBtn=document.getElementById('copyInvite');if(copyBtn)copyBtn.addEventListener('click',()=>{const txt='Join our SIH team on '+location.origin+'/?join\nTeam ID: '+TEAM.teamCode+'\nPassword: '+(TEAM.teamPassword||'');navigator.clipboard&&navigator.clipboard.writeText(txt);toast('Invite copied');});
  document.getElementById('psCount').addEventListener('input',e=>{TEAM.psCount=e.target.value===''?null:Number(e.target.value);const o=odds();oBig.textContent=o.big;oBig.style.color=o.c;oBar.style.width=o.w+'%';oV.textContent=o.t;oV.style.color=o.c;});
  document.getElementById('saveTeam').addEventListener('click',async()=>{
    const err=document.getElementById('tErr');err.textContent='';
    const body={teamName:teamName.value,psId:psId.value,psCount:psCount.value,members:members.value.split(',').map(s=>s.trim()).filter(Boolean),femaleCount:fcount.value};
    if(!TEAM.wantsLeader){body.ideaId=document.getElementById('idea').value;body.backupIdeaId=document.getElementById('backup').value;}
    try{const d=await api('/api/my/team',{method:'PUT',body:JSON.stringify(body)});TEAM=d.team;toast('Saved ✓');render();}catch(ex){err.textContent=ex.message;}
  });
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>document.getElementById('f-'+b.dataset.open).classList.toggle('cc-hidden')));
  MILES.forEach(m=>{const f=document.getElementById('f-'+m.id);if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();const er=f.querySelector('.err');er.textContent='';const fd=new FormData(f);try{const d=await api('/api/my/submission',{method:'POST',body:JSON.stringify({milestoneId:m.id,github:fd.get('github'),deck:fd.get('deck'),demo:fd.get('demo'),live:fd.get('live'),notes:fd.get('notes')})});SUBS=SUBS.filter(s=>s.milestoneId!==m.id);SUBS.push(d.submission);render();toast('Submitted ✓');}catch(ex){er.textContent=ex.message;}});});
  document.querySelectorAll('[data-ack]').forEach(b=>b.addEventListener('click',async()=>{await api('/api/my/directive/'+b.dataset.ack+'/ack',{method:'POST'});const dd=TEAM.directives.find(x=>x.id==b.dataset.ack);if(dd)dd.done=true;render();}));
  document.getElementById('chatForm').addEventListener('submit',async e=>{e.preventDefault();const inp=document.getElementById('chatInput');const t=inp.value.trim();if(!t)return;inp.value='';try{await api('/api/my/comment',{method:'POST',body:JSON.stringify({text:t})});await loadChat();}catch(ex){toast(ex.message);}});
  loadChat();
  if(chatTimer)clearInterval(chatTimer);chatTimer=setInterval(loadChat,8000);
}

async function boot(){
  const d=await api('/api/my').catch(()=>({user:null}));
  if(!d.user){location.href='/apply.html?login';return;}
  if(d.user.role==='admin'||d.user.role==='lead'){location.href='/admin.html';return;}
  ME=d.user;TEAM=d.team;
  if(ME.isCaptain && !ME.signedAgreement){IDEAS=await api('/api/ideas');MILES=await api('/api/milestones');showAgreement();return;}
  if(!TEAM){location.href='/status.html';return;}
  IDEAS=await api('/api/ideas');MILES=await api('/api/milestones');SUBS=await api('/api/my/submissions');
  CONN=await api('/api/connect/summary').catch(()=>null);
  render();
}
boot();
</script>
</body>
</html>
